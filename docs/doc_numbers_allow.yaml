# doc_facts.py check가 결과 숫자가 아니라고 보고 넘기는 숫자. 결과(정확도, 감사, 시간, 비용, 개수)는 여기에 두지 않는다.
allow:
  단계와_장_번호: [0, 1, 2, 3, 6, 7, 8, 9, 10, 11, 12, 16, 17, 19, 20, 22]   # review-run.md 단계 번호, 문서 안 장 번호
  규칙값: ["0.80", "90", "95", "50", "5", "2"]   # 95는 95% 구간. CLAUDE.md: 정답 세트 기준 F1 0.80과 감성 90%, 감사 FAIL 기준 5%, 묶음 50개, 전용 주제 5번 이상, 재시도 최대 2번
  없음을_뜻하는_0: [0]
example_paths:
  - config/categories/hair_removal.yaml   # 새 카테고리 예시(아직 없는 파일)
