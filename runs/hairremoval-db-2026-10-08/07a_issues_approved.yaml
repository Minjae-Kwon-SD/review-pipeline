        include: 사용 전에 매번, 자주 면도해야 해서 번거롭다는 말
        exclude: 면도 횟수가 줄었다는 효과 이야기는 hair_reduction, 면도 안 한 털 때문에 아프다는 말은 pain_comfort
        examples:
        - review_id: R2MZ9ZWPKOLRZQ
          quote: the fact that i have to shave before every use is a little annoying
        - review_id: R1E37CQXV0TSOA
          quote: You also have to shave a lot.
        approx_count: 3
      other_approx_count: 3
      notes: 기타는 쏜 자리를 알기 어렵다(2개), 교체 부품 세척이 어렵다(1개). R3D6Y9OCRHDR0X "the skin sensor is too sensitive"와 R2HTPKGOEZ3WN7 "won't flash because it is reading red"는 접촉 센서인지 피부색 센서인지 애매해 sensor_auto_adjust로 셌다(피부색으로 막는 것이면 skin_hair_suitability 쪽). shaving_prep은 주제 정의에 직접 적혀 있지 않은 사전 준비 부담이라 treatment_time(관리 부담)으로 옮길지 정해 주세요.
    positive:
      quotes: 176
      sampled: 150
      only_other: false
      labels:
      - id: easy_to_use
        name_ko: 쓰기 쉽고 간단함
        name_en: Easy and simple to use
        include: 쓰기 쉽다, 간단하다, 처음 써도 된다, 꽂고 켜서 바로 쓴다, 설정이 쉽다, 편하게 쓴다는 전반적인 말
        exclude: 설명서를 칭찬하면 clear_instructions, 집에서 할 수 있다는 편리함은 home_convenience, 자동 모드나 단계 조절 기능을 지목하면 handy_modes
        examples:
        - review_id: RAUDHBMFX7194
          quote: The device itself is also very easy to use, even as a beginner
        - review_id: R25H686ZWIWEWC
          quote: This device is very easy to use, plug, turn on and go.
        approx_count: 115
      - id: clear_instructions
        name_ko: 설명서가 분명함
        name_en: Clear instructions
        include: 설명서가 분명하다, 간단하다, 알아보기 쉽다는 말
        exclude: 설명서 언급 없이 쓰기 쉽다는 말은 easy_to_use
        examples:
        - review_id: R3EVC73JWUDCAY
          quote: Instructions are clear and straightforward making the product easy to use.
        - review_id: R18D1G0XPQQ91Y
          quote: The instructions were straightforward
        approx_count: 13
      - id: home_convenience
        name_ko: 집에서 할 수 있어 편함
        name_en: Convenient to do at home
        include: 살롱에 가지 않고 집에서, 혼자 편하게 할 수 있어 좋다는 말
        exclude: 살롱보다 돈을 아낀다는 말은 price_value, 집 언급 없이 편하다는 말은 easy_to_use
        examples:
