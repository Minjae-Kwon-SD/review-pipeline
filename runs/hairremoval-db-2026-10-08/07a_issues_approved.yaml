      other_approx_count: 9
      notes: 표본 대부분이 "easy to use" 한마디라 easy_to_use가 4분의 3을 넘는다. 기타는 세척과 관리가 쉽다(3개), 피부 센서가 잘 된다(2개), 앱(2개), 가볍고 다루기 쉽다(R7SFT1B4QUIDU, 무게는 design 쪽), 교체 헤드 덕에 쉽다(RRCG4FZAZP9UC, 헤드는 design 쪽). "easy to use, instructions are clear"처럼 두 칭찬이 한 인용에 있으면 easy_to_use와 clear_instructions 둘 다 셌다.
- topic: treatment_time
  name_ko: 시술 시간과 관리 부담
  directions:
    negative:
      quotes: 79
      sampled: 79
      only_other: false
      labels:
      - id: long_session
        name_ko: 한 번 시술이 오래 걸림
        name_en: Sessions take a long time
        include: 시간이 많이 든다, 오래 걸린다, 몇 시간 걸린다는 말 중 부위, 원인, 비교 대상, 횟수를 말하지 않는 것(time consuming, takes forever, 시술 한 번에 30분)
        exclude: 다리나 몸 전체 같은 넓은 부위를 말하면 large_area_slow, 발광 간격이 원인이면 slow_flash, 작은 조사창이나 반복 조사가 원인이면 small_window_passes, 광고나 기대, 면도와 비교하면 longer_than_expected, 자주 오래 해야 하는 일정이면 demanding_schedule
        examples:
        - review_id: R2T3HFTC3IYYEJ
          quote: Time consuming treatments.
        - review_id: R217CA2CSB1IWD
          quote: This takes forever to do a treatment.
        approx_count: 26
      - id: large_area_slow
        name_ko: 다리나 몸 전체 같은 넓은 부위가 오래 걸림
        name_en: Large areas take too long
        include: 다리, 몸 전체, 가슴과 등처럼 넓은 부위를 하는 데 오래 걸린다, 몇 시간 걸린다, 오래 걸려 다리는 포기했다는 말(원인은 말하지 않음)
        exclude: 작은 조사창이나 여러 번 덧대야 해서라는 원인을 말하면 small_window_passes, 발광 간격 때문이라고 하면 slow_flash, 부위 언급 없이 오래 걸린다는 말은 long_session
        examples:
        - review_id: R16RHLDXFP7HCJ
          quote: It took me an hour and a half to do both legs plus bikini line.
        - review_id: RI2SISRQKM0M2
          quote: the device takes quite a while to treat larger areas like the legs
        approx_count: 14
      - id: slow_flash
        name_ko: 발광 간격이 길거나 기기가 느림
        name_en: Slow flash rate or recharge wait
        include: 발광 속도가 느리다, 쏘고 나서 다음 발광까지 몇 초 기다려야 한다, 다시 데워지거나 식기를 기다려야 한다, 자동 모드가 빠르지 않다, 기기 자체가 느리다(slow, lenta)
        exclude: 조사창 크기나 반복 조사가 원인이면 small_window_passes, 원인 없이 시술이 오래 걸린다는 말은 long_session
        examples:
        - review_id: R2ZW83BMFS2C92
          quote: the flashing speed is slow
        - review_id: R3SYQQVFXZOBU4
          quote: It takes forever to reheat in between each time push the button!
        approx_count: 10
      - id: small_window_passes
        name_ko: 작은 조사창이나 반복 조사 때문에 오래 걸림
        name_en: Small window or repeat passes slow it down
        include: 헤드나 조사창, 기기가 작아 오래 걸린다, 한 곳을 두세 번 덧대야 한다, 굴곡진 부위는 천천히 조심스럽게 지나가야 한다
        exclude: 발광 사이 대기 시간은 slow_flash(둘 다 말하면 두 라벨), 원인 없이 넓은 부위가 오래 걸린다는 말은 large_area_slow, 큰 헤드가 있어야 한다는 요구만 있으면 이 주제가 아님(design)
        examples:
        - review_id: RXBX1IOM03910
          quote: el cabezal pequeño hace que la depilación de zonas grandes sea demorado
        - review_id: RKY1PUP3AY62W
          quote: time consuming especially on large areas like legs since you have to go over the area two to three times
        approx_count: 6
      - id: demanding_schedule
        name_ko: 자주, 오래 지켜야 하는 일정이 부담
        name_en: Demanding treatment schedule
        include: 이틀마다, 주 2~3회, 매일, 몇 달에서 1년, 평생 매주 해야 한다는 부담, 일정을 따를 시간이 없다, 계속 챙기기 힘들다, 세션이 많이 필요하다
        exclude: 한 번 시술 시간만 말하면 long_session이나 large_area_slow, 효과가 보이기까지의 기간 자체나 꾸준함을 효과 조건으로만 말하면 이 주제가 아님(hair_reduction)
        examples:
        - review_id: R2FA3ODX0DHYD8
          quote: Having to do this 2 times a week for 5 months
        - review_id: R2R2920RW4FYD8
          quote: It's definitely a time investment to have to use this every other day.
        approx_count: 19
      - id: longer_than_expected
        name_ko: 광고나 기대보다 오래 걸림
        name_en: Takes longer than advertised or expected
        include: 광고한 10분보다 오래 걸린다, 예상보다 오래 걸린다, 면도나 다른 기기보다 오래 걸리거나 시간이 줄지 않았다
        exclude: 비교 대상 없이 오래 걸린다는 말은 long_session, 효과가 광고보다 늦게 나온다는 말은 이 주제가 아님(hair_reduction)
        examples:
        - review_id: R3DS39VF4SYRUU
          quote: it takes way longer than 10 mins like advertised
        - review_id: R3TBTATZWLRUQN
          quote: much more time consuming than they advertise
        approx_count: 6
      other_approx_count: 2
      notes: '"This increases the amount of time", "drag my session from minutes to hours"처럼 원인이 인용 밖(앞 문장)에 있어 보이는 말은 원인을 알 수 없어 long_session으로 셌다. "se necesitan muchas sesiones"는 일정 부담으로 셌지만 효과 기간(hair_reduction)과 경계가 가깝다.'
    positive:
      quotes: 47
      sampled: 47
      only_other: false
      labels:
      - id: quick_session
        name_ko: 시술이 빠르고 오래 안 걸림
        name_en: Quick sessions
        include: 빠르다, 금방 끝난다, 오래 안 걸린다, 시간이 많이 들지 않는다, 한 번에 2분, 5분, 10분이면 된다(부위 언급 없거나 겨드랑이처럼 작은 부위)
        exclude: 다리나 몸 전체를 짧게 끝낸다는 말은 large_area_quick, 발광 속도나 자동 모드, 이중 발광 덕분이라고 하면 fast_flash_mode, 주당 횟수나 주 단위 시간은 light_schedule
        examples:
        - review_id: R3I3HAIAL07C08
          quote: a full session only takes about 10 minutes
        - review_id: R6HJL2H1R3J9U
          quote: the process is quick and convenient
        approx_count: 28
      - id: fast_flash_mode
        name_ko: 발광이 빠르거나 자동 모드, 이중 발광으로 빨라짐
        name_en: Fast flash or auto and double flash modes
        include: 발광 주기가 빠르다, 자동 모드(Auto-Glide)가 빠르다, 이중 발광 덕에 빨리 끝난다
        exclude: 원인 없이 빠르다는 말은 quick_session, 자동 모드의 조작 편리함(버튼을 안 눌러도 된다)은 이 주제가 아님(ease_of_use)
        examples:
        - review_id: R371G2D4TFMWP7
          quote: The double flash of the Ulike makes the process pretty quick.
        - review_id: R45A68G8D9H22
          quote: Treatment sessions are super fast with the Auto-Glide mode
        approx_count: 5
      - id: large_area_quick
        name_ko: 다리나 몸 전체도 짧게 끝남
        name_en: Large areas done quickly
        include: 다리, 종아리, 머리부터 발끝까지 같은 넓은 부위를 몇 분에서 30분 안에 끝낸다, 다리도 비교적 빨리 된다
        exclude: 겨드랑이처럼 작은 부위나 부위 언급 없이 빠르다는 말은 quick_session
        examples:
        - review_id: R1UMNQC5X9R7VI
          quote: It’s quick to use, and I can treat larger areas like my legs in about 10 minutes.
        - review_id: R2IW5AKUW2LVDH
          quote: it only takes me about 10 minutes total to do the lower section of both legs
        approx_count: 4
      - id: light_schedule
        name_ko: 일정이 가볍고 생활에 맞추기 쉬움
        name_en: Light, easy-to-keep schedule
        include: 주 2회, 몇 주에 한 번만 하면 된다, 일주일에 20분 이하, 주간 루틴에 넣기 쉽다, 일정을 지키기 쉬웠다
        exclude: 한 번 시술이 빠르다는 말만 있으면 quick_session, 효과가 몇 주 만에 보였다는 말은 이 주제가 아님(hair_reduction)
        examples:
        - review_id: R17Z3G31WY4J6A
          quote: you only have to use it 2 times a week to start seeing results
        - review_id: R2D5BIKVEMGFGD
          quote: I also love that you only need to use it every couple of weeks
        approx_count: 6
      - id: time_worth_it
        name_ko: 시간이 들지만 견딜 만하거나 그만한 가치가 있음
        name_en: Time is acceptable or worth it
        include: 시간이 좀 들고 지루하지만 나쁘지 않다, 효과가 있으니 발광 간격도 신경 쓰이지 않는다, 시간이 들어도 결과가 그만한 가치가 있다(혼합 인용의 칭찬 부분)
        exclude: 시간이 오래 걸린다는 불만만 있으면 negative 쪽 라벨, 빠르다는 칭찬은 quick_session
        examples:
        - review_id: R380XCNEXZQ8JX
          quote: It is a little time consuming for the results have been worth it for me.
        - review_id: R1KWW1ZMRJ0A1O
          quote: It will take a little time and feel tedious, but it isn't too bad.
        approx_count: 3
      other_approx_count: 2
      notes: '"ahorra mucho tiempo y dinero", "It saves me time and salon trips"처럼 살롱이나 면도 대비 시간을 아낀다는 말은 2개(5% 미만)라 기타로 셌다.'
- topic: skin_hair_suitability
  name_ko: 피부색과 털 색 적합성
  directions:
    negative:
      quotes: 65
      sampled: 65
      only_other: false
      labels:
      - id: dark_skin_tone
        name_ko: 어두운 피부색에는 못 씀
        name_en: Not for darker skin tones
        include: 사람의 피부색 자체(태닝, 갈색, 올리브, 어두운 피부, 멜라닌)가 어둡거나 중간 톤이라 기기가 안 되거나, 센서가 피부색을 너무 어둡다고 읽어 못 쓴다는 말. 밝은 피부에만 맞는다는 말 포함
        exclude: 피부색은 대상인데 비키니, 겨드랑이처럼 몸의 일부 어두운 부위에서만 막히거나 안 듣는다는 말은 dark_body_areas
        examples:
        - review_id: R29W8ON8A13KN7
          quote: does not work on tanned or darker skin
        - review_id: R1T9EUE1DCTJRE
          quote: This item is not for dark skinned women.
        approx_count: 20
      - id: dark_body_areas
        name_ko: 비키니나 겨드랑이처럼 어두운 부위에서 안 됨
        name_en: Blocked or weak on darker body areas
        include: 비키니, 겨드랑이, 은밀한 부위, 허벅지 안쪽처럼 몸에서 색이 더 짙은 부위에서 센서가 발광을 막거나, 효과가 없거나 더 오래 걸린다는 말
        exclude: 사람의 피부색 전체가 어두워 못 쓴다는 말은 dark_skin_tone. 피부색 언급 없이 부위마다 효과가 다르다는 말은 이 주제가 아님(hair_reduction)
        examples:
        - review_id: RSE01I2TC1E64
          quote: the sensor would never light up in my bikini area
        - review_id: R3TZKM2YDQ6CJZ
          quote: it doesn't work well on areas where my skin is too dark
        approx_count: 11
      - id: light_fine_hair
        name_ko: 금발이나 옅은 털, 가는 솜털에는 안 들음
        name_en: Weak on blonde, light or fine hair
        include: 금발, 옅은 갈색, 붉은 갈색처럼 옅은 털이나 가는 솜털에는 효과가 없다, 진한 털이 아니면 사지 마라, 털이 가늘면 살 필요가 없다는 말
        exclude: 흰 털, 회색 털은 gray_white_hair. 굵은 털에 안 듣는다는 말은 thick_coarse_hair
        examples:
        - review_id: R1BICTURUAEEBJ
          quote: Does not work for blonde or light brown hair.
        - review_id: R2W2I33M3721W2
          quote: does not help with light colored hair
        approx_count: 11
      - id: gray_white_hair
        name_ko: 흰 털이나 회색 털에는 안 들음
        name_en: Does not work on gray or white hair
        include: 흰 털, 회색 털, 나이 들며 생긴 흰 수염 같은 털에는 효과가 없다는 말
        exclude: 금발이나 옅은 색 털만 말하면 light_fine_hair(금발과 회색을 함께 말하면 두 라벨 모두)
        examples:
        - review_id: REG0KPBJPIX8G
          quote: Doesn’t work on white hair.
        - review_id: R3NZXB8W5SMK1Z
          quote: Does not work on gray whisker hairs of an aging woman.
        approx_count: 6
      - id: thick_coarse_hair
        name_ko: 굵고 억센 털에는 덜 들음
        name_en: Weak on thick or coarse hair
        include: 굵은 털, 억센 털, 질긴 털에는 효과가 없거나 느리다, 굵은 털이면 다른 제품을 찾으라는 말
        exclude: 가는 털이라 살 필요가 없다는 말은 light_fine_hair. 털 굵기 언급 없이 효과가 없다는 말은 이 주제가 아님(hair_reduction)
        examples:
        - review_id: R9TSKT8GTJAHE
          quote: Doesn't work good on thicker hairs
        - review_id: R18W4UM9JN0TUP
          quote: Do not buy for coarser hair.
        approx_count: 13
      other_approx_count: 6
      notes: 센서가 발광을 막는다는 말은 따로 라벨을 두지 않고 피부색 전체(dark_skin_tone)인지 몸의 어두운 부위(dark_body_areas)인지로 나눴습니다. 기타에는 맞는 유형인데도 안 됐다는 배경 언급(R2DVO9V4IS6M9K, R1FZ8Q4JKOG31O)처럼 스키마상 hair_reduction에 가까운 인용과, 무엇이 문제인지 불분명한 인용(R3VS4576GY70LY, R18UY4HW9LQGON, R1H1B6Y8QUCDUM, R2T2JDN7PVVK4G)이 들어 있습니다.
    positive:
      quotes: 14
      sampled: 0
      only_other: true
      labels: []
      other_approx_count: 14
      notes: only_other(인용 14개, 표본 없음)
- topic: accessories
  name_ko: 구성품과 보관 케이스
  directions:
    negative:
      quotes: 20
      sampled: 20
      only_other: false
      labels:
      - id: goggles_missing
        name_ko: 보안경이 없거나 빠져 옴
        name_en: Goggles not included or missing
        include: 보안경(glasses, goggles, lentes, gafas)이 구성에 없거나 받은 상자에 빠져 있었다, 따로 사야 했다, 들어 있어야 한다는 말
        exclude: 들어 있는 보안경이 잘 안 맞거나 빛을 못 막는다는 말은 goggles_poor_fit, 보관 케이스가 없다는 말은 case_lacking
        examples:
        - review_id: R300NO6N06MI3R
          quote: You have to purchase your goggle separately.
        - review_id: R5SZEZK6R7OAM
          quote: faltaron los lentes
        approx_count: 11
      - id: goggles_poor_fit
        name_ko: 보안경 착용감이나 품질 불만
        name_en: Goggles fit poorly or protect poorly
        include: 들어 있는 보안경이 안경 위에 안 맞는다, 허술하다, 빛을 잘 막지 못한다는 말
        exclude: 보안경이 아예 없거나 빠져 왔다는 말은 goggles_missing, 섬광이 눈에 해롭다는 안전 우려 자체는 safety 주제
        examples:
        - review_id: R30ODGD4OXKWUU
          quote: the safety glasses that come with this product are not well made ESPECIALLY if you wear glasses!
        - review_id: R2V5RNF586IBAW
          quote: Glasses didn’t offer much help against laser light
        approx_count: 4
      - id: case_lacking
        name_ko: 보관 케이스가 없거나 아쉬움
        name_en: Storage case missing or unappealing
        include: 보관 케이스나 파우치가 없어 아쉽다, 있었으면 좋겠다, 케이스 색이나 모양이 마음에 들지 않는다는 말
        exclude: 제품 상자(배송 온 상자)의 상태나 외관은 packaging 주제, 보안경이나 면도기가 빠진 것은 goggles_missing 또는 기타
        examples:
        - review_id: R1YD46GOLUQL4B
          quote: Me encantó! Me ubuera gustado tener un estuche :D
        - review_id: RJ70XYUA71OQC
          quote: the case it came with is a pinkish/coral color, which is a little conspicuous to have around
        approx_count: 3
      other_approx_count: 2
      notes: 면도기가 빠졌다는 말은 2개(R34MFAS0SGKRBD, R2LT3QNM94WMEI의 보안경과 함께 빠진 경우)뿐이라 라벨로 두지 않음. R3LDIX6PWLVIRZ("said was included")는 스키마상 설명과 다른 구성이라 trust에 가까움. 보안경이 원래 구성에 없는 것(B07WYY6KKC)과 받은 상자에서 빠진 것(B0CV3ZJ2PN)은 인용만으로 가르기 어려워 goggles_missing 하나로 합침. R2QV46JTGZRGAW, R2IBA63SK8LQIJ는 인용에 불만 내용이 거의 없거나 무엇이 문제인지 없어 기타.
    positive:
      quotes: 41
      sampled: 41
      only_other: false
      labels:
      - id: case_nice
        name_ko: 보관 케이스나 파우치가 좋음
        name_en: Nice storage case or pouch
        include: 함께 오는 보관 케이스, 파우치, 가방이 예쁘다, 튼튼하다, 고급스럽다, 정리가 잘 된다는 말
        exclude: 필요한 것이 다 들어 있다는 구성 전체 평은 complete_kit, 제품 상자의 포장 상태는 packaging 주제
        examples:
        - review_id: RDP6VFH1J365D
          quote: It comes in a nice, heavy duty case with specific cavities for each item.
        - review_id: R4BPUJN9EOB08
          quote: the storage case is beautiful
        approx_count: 22
      - id: goggles_included
        name_ko: 보안경이 들어 있음
        name_en: Protective goggles included
        include: 보안경이 함께 들어 있어 좋다, 안경 위에도 맞는다, 착용감이 편하다는 말
        exclude: 보안경을 여러 구성품 중 하나로 나열하며 다 들어 있다고만 하면 complete_kit
        examples:
        - review_id: R3INSXQHFCICQI
          quote: love that it comes with the sunglasses to protect your eyes
        - review_id: RJ86SS9SV6XB0
          quote: the glasses fit over my prescription ones so it’s easy to protect my eyes
        approx_count: 9
      - id: complete_kit
        name_ko: 필요한 구성품이 다 들어 있음
        name_en: Complete kit with everything needed
        include: 필요한 것이 다 들어 있다, 완전한 구성이다, 빠진 것 없이 왔다(viene con todos sus artículos)는 말이나 구성품을 세 가지 이상 나열하며 갖춰졌다고 하는 말
        exclude: 케이스 하나의 모양이나 튼튼함을 칭찬하면 case_nice, 보안경 하나를 짚어 칭찬하면 goggles_included
        examples:
        - review_id: R9H5CZX785L9U
          quote: comes with everything you need to get started
        - review_id: R2TNKBB9DW6MXY
          quote: includes everything—charger, goggles, blades, manual
        approx_count: 9
      other_approx_count: 2
      notes: 면도기 포함을 칭찬하는 말은 케이스나 보안경과 함께 나오는 경우가 대부분이라 따로 두지 않음. R2IBA63SK8LQIJ, R1YD46GOLUQL4B(혼합)는 인용에 구성품 칭찬이 없어 기타. B0G39WBP1S 인용이 18개로 표본의 절반 가까이를 차지함.
