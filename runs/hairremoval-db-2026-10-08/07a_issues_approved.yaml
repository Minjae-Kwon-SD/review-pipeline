      - id: handy_modes
        name_ko: 자동 모드와 단계 조절이 편함
        name_en: Handy auto mode and settings
        include: 자동 모드 덕에 버튼을 계속 누르지 않아도 된다, 세기를 원하는 대로 조절할 수 있다, 모드가 여러 개다, 화면이나 터치스크린으로 설정 바꾸기가 쉽다는 말
        exclude: 자동 모드가 빨라서 시간이 준다는 말은 treatment_time, 피부 센서 칭찬은 기타
