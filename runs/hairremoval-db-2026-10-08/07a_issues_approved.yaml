status: PASS
version: approved
topics:
- topic: price_value
  name_ko: 가격 대비 가치
  directions:
    negative:
      quotes: 125
      sampled: 125
      only_other: false
      labels:
      - id: not_worth_money
        name_ko: 돈 낭비, 값어치 없음
        name_en: Waste of money
        include: 돈 낭비다, 돈을 버렸다, 돈 아껴라, 값어치가 없다, 돈값을 못 한다는 판정만 있고 인용 안에 이유(효과, 고장)가 없는 말
        exclude: 인용 안에 효과가 없다는 이유가 붙으면 disappointing_for_price, 고장이나 짧은 수명이 붙으면 expensive_for_lifespan, 가격이 높다는 말만 있으면 too_expensive
        examples:
        - review_id: R1WTL5624OGXU
          quote: Waste of money.
        - review_id: RI2SISRQKM0M2
          quote: Not worth the money
        approx_count: 59
      - id: disappointing_for_price
        name_ko: 가격에 비해 효과나 성능이 실망스러움
        name_en: Disappointing results for the price
        include: 가격을 들며 효과, 결과, 성능이 기대에 못 미친다, 이 값이면 더 나아야 한다, 이만큼 썼는데 실망이다는 말(효과가 없어 돈을 버렸다 포함)
        exclude: 가격에 비해 빨리 고장 나거나 수명이 짧다는 말은 expensive_for_lifespan, 이유 없는 돈 낭비 판정은 not_worth_money
        examples:
        - review_id: R18UY4HW9LQGON
          quote: For the price.. and zero results.
        - review_id: R28HE7BFJAEMNS
          quote: Given the price of this device, it was disappointing.
        approx_count: 28
      - id: expensive_for_lifespan
        name_ko: 비싼 값에 비해 빨리 고장 남
        name_en: Too costly for its short lifespan
        include: 이 가격이면 더 오래 가야 한다, 몇 주나 몇 달 만에 고장 났다, 몇 번 못 쓰고 멈췄다처럼 가격과 고장, 내구성, 수명을 함께 말하는 것
        exclude: 가격과 함께 효과가 없다는 말은 disappointing_for_price, 가격 없이 고장만 말하는 것은 이 주제가 아님(quality)
        examples:
        - review_id: RTZ6KQ6T15U3J
          quote: I would think for $350 this product would last longer than 4 months.
        - review_id: R2JM1I6ZLDWZ00
          quote: Way too expensive for its useful life
        approx_count: 17
      - id: too_expensive
        name_ko: 가격 자체가 비쌈
        name_en: Too expensive
        include: 비싸다, 너무 비싸다, 가격이 과하다, 다른 제품보다 몇 배 비싸다처럼 가격 수준 자체를 말하는 것(할인 없이는 실망했을 것이라는 말 포함)
        exclude: 비싼데 효과가 없다는 말은 disappointing_for_price, 비싼데 고장 났다는 말은 expensive_for_lifespan, 비싸지만 값어치가 있다는 말은 positive 방향
        examples:
        - review_id: R1F3PPA88YT8QQ
          quote: Too expensive.
        - review_id: R1BW5S0JJO319S
          quote: Very expensive and found others at less than 1/2 the price
        approx_count: 14
      other_approx_count: 7
      notes: 기타는 산 뒤 가격 인하 2, 교체 헤드나 충전기 추가 비용 2, 그 돈으로 면도기나 전기 제모, 전문 시술을 했어야 한다 3. "waste of time and money"의 시간 부분은 이 주제 밖. R2OEZ28614WRBE는 성능과 내구성을 함께 말해 disappointing_for_price와 expensive_for_lifespan 둘 다 될 수 있음
    positive:
      quotes: 111
      sampled: 111
      only_other: false
      labels:
      - id: worth_the_money
        name_ko: 값어치가 있음
        name_en: Worth the money
        include: worth it, worth every penny, 좋은 투자다, vale la pena처럼 쓴 돈만큼 값어치가 있다는 판정(비싸지만 값어치가 있다 포함)
        exclude: 가격이 싸다, 가성비가 좋다, 할인으로 샀다는 말은 good_price, 살롱이나 전문 시술과 비교하면 saves_vs_salon
        examples:
        - review_id: R13MHEVNHMPLOI
          quote: Worth every penny!!
        - review_id: R2WQNV39LKPB5G
          quote: Yes, it’s on the expensive side, but for me it’s been completely worth it
        approx_count: 45
      - id: saves_vs_salon
        name_ko: 살롱이나 전문 레이저 시술보다 쌈
        name_en: Cheaper than salon treatments
        include: 살롱, 클리닉, 전문 레이저 시술, estéticas에 드는 돈과 비교해 싸다, 돈을 아낀다(면도기와 함께 비교해도 여기)
        exclude: 살롱 비교 없이 돈을 아낀다는 말은 saves_money_overall, 살롱에 안 가도 되는 편리함만 말하면 이 주제가 아님(ease_of_use)
        examples:
        - review_id: R3V0MABRCY0HJC
          quote: the cost is a lot lower compare to the salon
        - review_id: R2KLY3J5B81QZS
          quote: Definitely more cost effective them salon treatments
        approx_count: 28
      - id: saves_money_overall
        name_ko: 길게 보면 돈을 아낌
        name_en: Saves money over time
        include: 살롱 언급 없이 돈을 아낀다, 길게 보면 절약이다, 면도기나 면도 크림 같은 용품을 안 사도 된다
        exclude: 살롱이나 전문 시술과 비교하면 saves_vs_salon, 시간을 아낀다는 부분은 이 주제가 아님(treatment_time)
        examples:
        - review_id: R3GMJKYQ9OQT80
          quote: it saves both time and money on razors and shaving cream
        - review_id: R2WJT0O7RZ6EXV
          quote: save a lot of money in the long run
        approx_count: 13
      - id: good_price
        name_ko: 가격이 착하고 가성비가 좋음
        name_en: Good value for the price
        include: 저렴하다, affordable, 가격에 비해 좋다(for the price), great value, bang for your buck, 할인이나 프라임데이에 잘 샀다
        exclude: 가격 수준 언급 없이 값어치가 있다는 판정(worth it, 투자)은 worth_the_money, 살롱보다 싸다는 비교는 saves_vs_salon
        examples:
        - review_id: R35JKDWHP2PZZ7
          quote: Great value for the price!
        - review_id: R2VNEBLNFNGTZ1
          quote: Got on prime day, and what a deal
        approx_count: 24
      other_approx_count: 1
      notes: worth_the_money와 good_price의 경계는 표현으로 가름(worth, investment는 값어치, value, affordable, for the price, deal은 가성비). 기타 1개는 R2527CST84MMJT(비용이 문제가 아니면 기능이 좋다는 혼합 인용)
- topic: brand_experience
  name_ko: 브랜드 경험
  directions:
    negative:
      quotes: 64
      sampled: 64
      only_other: false
      labels:
      - id: not_recommend
        name_ko: 비추천이나 사지 말라는 경고
        name_en: Does not recommend or warns not to buy
        include: 추천하지 않는다, 사지 마라, 돈 낭비하지 마라, Buyer beware처럼 다른 사람에게 이 제품을 권하지 않거나 사지 말라고 하는 말(이유가 같이 붙어도 포함)
        exclude: 자기가 다시 사지 않겠다는 말만 있으면 no_repurchase, 대신 다른 브랜드나 제품을 사라는 말은 switch_brand, 대신 전문 시술을 받으라는 말은 go_professional
        examples:
        - review_id: R3FLHL10LKK79F
          quote: I can not in good faith recommend this product to anyone
        - review_id: R1JUHDD7LBTKAK
          quote: Save your money, don't buy.
        approx_count: 37
      - id: no_repurchase
        name_ko: 다시 사지 않음
        name_en: Would not buy again
        include: 자기가 이 제품이나 모델을 다시 사지 않겠다, 같은 돈을 다시 쓰지 않겠다, 다시 사기 망설여진다는 말
        exclude: 다른 사람에게 사지 말라고 하면 not_recommend, 브랜드 전체를 다시 안 사겠다거나 회사에 실망했다는 말은 brand_disappointment
        examples:
        - review_id: R1NZEC16D5FOP4
          quote: I probably won’t rebuy this model when I run out of flashes
        - review_id: R20SYP9R1KMKDR
          quote: Will not buy again.
        approx_count: 7
      - id: switch_brand
        name_ko: 다른 브랜드나 제품이 나음
        name_en: Another brand or product is better
        include: 다른 브랜드(Ulike, INIA, Braun 등)나 다른 제품을 사라, 그쪽을 살 걸 그랬다, 이전에 쓴 다른 브랜드가 더 나았다, 경쟁 제품과 비슷한 수준이라는 비교
        exclude: 대신 전문 시술이나 살롱을 권하면 go_professional, 대안 없이 사지 말라는 말만 있으면 not_recommend
        examples:
        - review_id: RH6TJCI4IIG0W
          quote: Get Ulike instead for better comfort.
        - review_id: R3R5LESPOYWCJZ
          quote: Go with a different brand.
        approx_count: 7
      - id: go_professional
        name_ko: 전문 시술을 권함
        name_en: Recommends professional treatment instead
        include: 집에서 쓰는 기기보다 전문 레이저나 살롱 시술을 받으라, 전문 시술만큼 세지 않다, 집에서 스스로 하는 시술을 권하지 않는다는 말
        exclude: 다른 가정용 브랜드나 제품을 권하면 switch_brand, 살롱 비용과의 돈 비교는 price_value(이 주제가 아님)
        examples:
        - review_id: RR06PKULANNQ7
          quote: I would recommend just going to a professional
        - review_id: R3EGHJ3KA8QM68
          quote: don’t buy, go a professional places
        approx_count: 5
      - id: brand_disappointment
        name_ko: 브랜드나 광고에 실망
        name_en: Disappointed in the brand or its marketing
        include: 브랜드 제품 전체를 사지 마라, 그 브랜드에서 사는 것은 이번이 마지막, 회사가 부끄럽다, 광고나 인플루언서에 끌려 샀다는 브랜드 자체에 대한 불만
        exclude: 이 모델 하나를 다시 안 사겠다는 말은 no_repurchase, 광고 내용과 실물이 다르다는 말은 trust(이 주제가 아님)
        examples:
        - review_id: R2W6NAVMEMCRIR
          quote: Don’t buy ulike products.
        - review_id: R26RQQHSAX8XYF
          quote: I have purchased several items from Braun in the past but sadly this might be my last
        approx_count: 4
      other_approx_count: 4
      notes: 추천을 미루거나 망설이는 말(R2ZKCTG5R8L6PV, R27D9PZ4ENRQ81, R2MBCDJ6VJPRMQ, 어림 3개)은 5% 미만이라 기타로 두었다. "don't buy, go a professional places"처럼 비추천과 대안이 한 문장이면 대안 라벨을 우선하고, 라벨 단계에서 1~2개를 함께 달 수 있다.
    positive:
      quotes: 118
      sampled: 118
      only_other: false
      labels:
      - id: recommend
        name_ko: 추천이나 사라는 권유
        name_en: Recommends or urges others to buy
        include: 추천한다, 강력 추천, Lo recomiendo, Just buy it, Get it, 주변에 이미 추천했다, 모두에게 필요하다처럼 조건 없이 다른 사람에게 권하는 말
        exclude: 피부 유형, 꾸준함, 기대치 같은 조건을 붙인 추천은 conditional_recommend, 후회하지 않을 것이다는 no_regret, 다시 사겠다는 buy_again_or_upgrade
        examples:
        - review_id: R15CPIXT574AA3
          quote: I highly recommend it
        - review_id: R3CVPCV0EQPFAQ
          quote: do yourself a favour and buy it
        approx_count: 73
      - id: buy_again_or_upgrade
        name_ko: 재구매나 상위 모델로 바꿈
        name_en: Would buy again or upgraded
        include: 다시 사겠다, 두 번째로 샀다, 가족 몫으로 하나 더 사겠다, 같은 브랜드 상위 모델로 바꿨다
        exclude: 산 뒤 오래 계속 쓴다는 말은 keeps_using, 이전 모델보다 낫다는 비교만 있으면 favorable_comparison
        examples:
        - review_id: R3F4KBJINTRL7F
          quote: I had the U3 and it solved 70% of my problem, so I decided to upgrade and bought the U10.
        - review_id: R1MIIGBSIUFT00
          quote: I would defiantly buy it again.
        approx_count: 9
      - id: no_regret
        name_ko: 후회 없는 구매
        name_en: No regrets about buying
        include: 후회하지 않는다, 후회하지 않을 것이다, 돈 쓴 것이 아깝지 않다, 최고의 구매 중 하나라는 말
        exclude: 직접 사라고 권하는 말은 recommend, 다시 사겠다는 말은 buy_again_or_upgrade, 가격 대비 값어치 평가는 price_value(이 주제가 아님)
        examples:
        - review_id: R7IHM2Z8MJOFL
          quote: I do not regret this purchase!
        - review_id: R22D42ASN75CAQ
          quote: no te vas arrepentir
        approx_count: 8
      - id: keeps_using
        name_ko: 오래 계속 씀
        name_en: Keeps using it long term
        include: 몇 달, 1년, 3년째 쓰고 있다, 앞으로도 계속 쓸 것이다, 그만 쓸 수 없다, 써 보고 돌아보지 않았다는 말
        exclude: 오래 써도 고장이 없다는 내구성 평가는 quality(이 주제가 아님), 다시 샀다는 말은 buy_again_or_upgrade
        examples:
        - review_id: R2LZPF2047BAEK
          quote: I’ve used it on and off for 3 years
        - review_id: R2TNKBB9DW6MXY
          quote: Impossible to stop using it.
        approx_count: 8
      - id: favorable_comparison
        name_ko: 이전 기기나 다른 브랜드보다 만족
        name_en: Better than previous devices or other brands
        include: 이전 모델이나 예전에 쓴 다른 브랜드, 무명 기기보다 낫다, 시장의 다른 제품보다 이것을 권한다, 경쟁 브랜드에 견줄 만하다, 같은 브랜드 이전 제품도 좋았다
        exclude: 그 기기로 상위 모델을 다시 샀다는 말은 buy_again_or_upgrade, 브랜드 이름만 믿을 만하다는 말은 기타
        examples:
        - review_id: R13FFPKEUHQJ4V
          quote: So much better compared to my old no-brand laser hair remover
        - review_id: R27C7U0ZYUMOEM
          quote: I’ve used Ulike products before and had a great experience
        approx_count: 8
      - id: conditional_recommend
        name_ko: 조건을 붙인 추천
        name_en: Recommends with conditions
        include: 꾸준히 할 각오가 있으면, 밝은 피부라면, 일주일에 한 번 면도해도 괜찮다면, 전문 시술만큼 세지 않다는 것을 알면 추천한다처럼 조건을 걸고 권하는 말
        exclude: 조건 없는 추천은 recommend, 조건 때문에 결국 전문 시술을 받으라는 불만 부분은 부정 방향 go_professional
        examples:
        - review_id: R3I65RNL68LQ79
          quote: I definitely recommend getting the product as long as you are ready to commit
        - review_id: RXBX1IOM03910
          quote: Recomendable si eres cumplido con los días de depilación
        approx_count: 7
      other_approx_count: 5
      notes: 브랜드 이름 자체에 대한 신뢰(R2YRR62H3ARYRY "A Trusted Brand", R2527CST84MMJT Philips, R32K12744AFVIO "German engineering", 어림 3개)는 5% 미만이라 기타로 두었다. R33AU9CUYNIANU의 칭찬 부분("happy for the most part")은 이유 없는 전체 평에 가까워 기타로 셌다.
- topic: trust
  name_ko: 신뢰
  directions:
    negative:
      quotes: 40
      sampled: 40
      only_other: false
      labels:
      - id: misleading_claims
        name_ko: 과장 광고나 거짓 설명
        name_en: Misleading or false claims
        include: 광고, 설명, 사진이 실제와 다르다, 과장이다, 오해하게 만든다, 거짓이다, 사기다라는 말(효과, 시간, 출력, 안전 주장 포함)
        exclude: 피부색이나 털 색에 맞는다는 안내가 틀렸거나 없었다는 말은 suitability_misinformed, 설명에 적힌 구성품이 빠진 것은 missing_listed_items
        examples:
        - review_id: R253Q5MQJEFCR1
          quote: “full body in 10 mins” advertising is also misleading
        - review_id: R1Q2O18BTENX2M
          quote: Product is advertised as safe but this is the opposite!
        approx_count: 14
      - id: arrived_used
        name_ko: 중고나 개봉 흔적
        name_en: Arrived used or opened
        include: 새 제품으로 샀는데 쓴 흔적, 남의 털, 더러운 헤드, 열린 상자로 왔다, 반품된 것을 다시 판다는 말
        exclude: 설명에 적힌 구성품이 빠진 것만 말하면 missing_listed_items, 기기 고장이나 불량 자체는 quality(주제 밖)
        examples:
        - review_id: R1B2B516LQUZCQ
          quote: Arrived used
        - review_id: R374GN9CX6ILYP
          quote: llego la caja abierta y se ve usado y los cabezales sucios
        approx_count: 12
      - id: missing_listed_items
        name_ko: 설명과 다른 구성품
        name_en: Listed items missing
        include: 설명이나 설명서에 들어 있다고 한 헤드, 면도기, 보안경, 수건이 받은 상자에 없었다는 말
        exclude: 원래 구성에 없는 것을 아쉬워하는 말은 accessories(주제 밖), 중고 흔적과 함께 말하면 중고 흔적을 arrived_used로
        examples:
        - review_id: R1EGVNMV7X8WQX
          quote: The description says it comes with 2 heads and a razor but I only received 1 head and the razor was missing
        - review_id: RZH0ENS9J3SL
          quote: El manual indica que incluye razor y goggles, pero no vinieron en la caja.
        approx_count: 5
      - id: suitability_misinformed
        name_ko: 피부색 적합성 안내 부족이나 잘못된 안내
        name_en: Skin tone suitability not disclosed or misstated
        include: 어두운 피부에는 안 된다는 것을 알리지 않았다, 포장이나 협찬 홍보가 맞는다고 했는데 아니었다는 말
        exclude: 피부색 때문에 효과가 없거나 센서가 막는다는 경험 자체는 skin_hair_suitability(주제 밖), 피부색과 관계없는 과장 광고는 misleading_claims
        examples:
        - review_id: RL4CIP8VWPLYA
          quote: they never said it’s not for Black people or dark colored people
        - review_id: R3DXQ4VVNARZ78
          quote: You should make it clear that it is not for brown skin girls.
        approx_count: 4
      - id: doubted_before_purchase
        name_ko: 협찬 리뷰나 반품 표시로 생긴 의심
        name_en: Doubt from paid reviews or return warnings
        include: 반품이 잦은 상품 표시, 협찬과 유료 홍보, 평판 때문에 사기 전이나 쓰면서 의심했다는 말(혼합 인용의 의심 부분 포함)
        exclude: 광고 내용이 실제와 다르다고 판단한 말은 misleading_claims
        examples:
        - review_id: R2KLY3J5B81QZS
          quote: It says this is a frequently returned item so I was hesitant to buy. This product honestly works great
        - review_id: RKEMYTS0L15RN
          quote: I think there is a lot of paid promotion with this product.
        approx_count: 3
      other_approx_count: 2
      notes: R2LT3QNM94WMEI(사기라는 말이지만 이유가 배송 안 됨, shipping 쪽)와 R1LCIDY8581R4J(설명에 무엇이 없었는지 인용만으로 알 수 없음)는 기타로 셈. 안전하다는 광고가 거짓이라는 말(어림 2개)은 따로 두기엔 적어 misleading_claims에 합침.
    positive:
      quotes: 8
      sampled: 0
      only_other: true
      labels: []
      other_approx_count: 8
      notes: ''
