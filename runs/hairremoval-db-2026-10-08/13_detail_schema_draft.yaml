category: hairremoval
version: draft
sample_reviews: 150
# 13_detail_sample.csv 150개(영어, 스페인어 포함)를 모두 읽고 센 수. 리뷰 하나에 한 항목 값이 여럿일 수 있다(부위, 비교 대상이 여럿이면 하나씩).
# config/detail_rules.yaml과 이름이 같은 항목은 comparison_reference 하나. 그 규칙(대상마다 값 하나, 가장 구체적인 값, 같은지 다른지 모르면 other_product,
# 견주지 않은 언급은 비움, 듀프는 원조 관계를 말할 때만)과 value_notes(store_purchase)를 그대로 따랐다. purchase_context는 표본 부족으로 버림(discarded 참고).
items:
  - id: area_result
    name_ko: 부위별 효과
    kind: 1
    format: choice
    unit: null
    allowed_values:
      - {value: face_works, ko: "얼굴(윗입술, 턱, 수염)에 효과 있음"}
      - {value: face_weak, ko: "얼굴에 효과 없거나 약함"}
      - {value: underarm_works, ko: "겨드랑이에 효과 있음"}
      - {value: underarm_weak, ko: "겨드랑이에 효과 없거나 약함"}
      - {value: bikini_intimate_works, ko: "비키니나 은밀한 부위에 효과 있음"}
      - {value: bikini_intimate_weak, ko: "비키니나 은밀한 부위에 효과 없거나 약함(센서가 막음 포함)"}
      - {value: legs_works, ko: "다리(허벅지, 종아리)에 효과 있음"}
      - {value: legs_weak, ko: "다리에 효과 없거나 약함"}
      - {value: arms_works, ko: "팔에 효과 있음"}
      - {value: arms_weak, ko: "팔에 효과 없거나 약함"}
      - {value: torso_works, ko: "몸통(배, 가슴, 등)에 효과 있음"}
      - {value: torso_weak, ko: "몸통에 효과 없거나 약함"}
    definition: 리뷰어가 몸의 부위를 짚어 그 부위에서 털이 줄었는지, 효과가 없거나 약했는지(센서가 발광을 막아 못 쓴 것 포함) 말한 것. 부위마다 값 하나
    fill_rule: 부위 이름과 그 부위의 결과가 함께 있을 때만 채운다. 쓴 부위를 나열만 하고 결과를 전체로 말하면(다리, 겨드랑이, 윗입술에 썼는데 차이가 거의 없다) 비운다. 한 부위 안에서 되는 곳과 안 되는 곳을 모두 말하면 두 값을 다 넣는다. 통증이나 피부 반응이 난 부위는 이 항목이 아니라 discomfort_area
    quote_required: true
    sample_count: 28
    overlap: [hair_reduction, uneven_by_area, works_on_areas, dark_body_areas]
    new_info: 라벨은 부위마다 효과가 다르다는 사실만 세고, 이 항목은 어느 부위가 되고 어느 부위가 안 되는지(표본에서 겨드랑이 되는 쪽 13, 안 되는 쪽 7, 비키니 안 되는 쪽 5)를 센다
    examples:
      - {review_id: RXBX1IOM03910, quote: "Para axilas, bigote, bikini, etc funciona excelente."}
      - {review_id: RHIX3UB7PUARG, quote: "Underarms did nothing not even on the highest setting."}
    guide_use: [집중 분석, 소비자 기준표, 상세페이지 문구]

  - id: failed_component
    name_ko: 고장 난 부품이나 기능
    kind: 5
    format: choice
    unit: null
    allowed_values:
      - {value: no_power, ko: "전원이 켜지지 않음"}
      - {value: no_flash, ko: "켜지지만 발광하지 않거나 버튼을 눌러도 자주 헛발사"}
      - {value: shuts_off, ko: "켠 뒤 곧 저절로 꺼짐"}
      - {value: skin_sensor, ko: "피부 접촉 센서가 피부를 더는 읽지 못함"}
      - {value: mode_or_level, ko: "특정 모드(얼굴, 연속 발광)나 단계만 안 됨"}
      - {value: output_drop, ko: "발광 세기가 약해지거나 발광 간격이 길어짐"}
      - {value: power_supply, ko: "충전기, 배터리, 전원 방식 문제(꽂아야만 켜짐 포함)"}
      - {value: head_damage, ko: "헤드나 조사창 부식, 깨짐"}
    definition: 기기 고장이나 이상을 말할 때 무엇이 안 되는지(부품이나 기능). 털이 안 줄었다는 효과 이야기는 넣지 않는다
    fill_rule: 리뷰가 안 되는 부품이나 기능을 말할 때만 채운다. "not working", "stopped working"처럼 무엇이 안 되는지 없이 멈췄다고만 하면 비운다(라벨 failure_unspecified가 셈). 과열로 꺼지거나 쉬어야 하는 것, 조사창 얼룩과 탄내는 라벨(overheating, scorch_marks_smell)이 이미 세므로 넣지 않는다. 피부색이나 어두운 부위 때문에 센서가 막는 것은 고장이 아니므로 비운다
    quote_required: true
    sample_count: 16
    overlap: [early_failure, failed_after_months, failure_unspecified, partial_failure, intermittent_malfunction, fragile_build, not_cordless]
    new_info: 품질 라벨은 고장을 시기(한 달 안, 한 달 넘게, 언급 없음)로 나누고, 이 항목은 고장 난 부품(전원, 발광, 센서, 모드, 충전기)을 센다
    examples:
      - {review_id: R2OSHXQ067Z325, quote: "It turns on when I turn it on but has no pulsation anymore."}
      - {review_id: R38YNQA8ATNIF1, quote: "Suddenly, it stops detecting the skin and does not flash."}
    guide_use: [집중 분석, 경쟁사 점수표, 시장 진입 조건]

  - id: failure_time
    name_ko: 고장까지 쓴 기간
    kind: 6
    format: number
    unit: 개월
    allowed_values: []
    definition: 기기가 멈추거나 고장, 이상(얼룩, 센서 불량 포함)이 처음 생기기까지 쓴 기간
    fill_rule: 리뷰가 기간을 숫자나 말로 분명히 적을 때만 채운다(a month는 1, about a year는 12, 1.5 months는 1.5, nine months는 9). "after a few months", "less than a month"처럼 숫자를 정할 수 없으면 비운다. "2nd time", "after 3 uses"처럼 횟수로만 말하면 비운다(라벨 early_failure가 셈). 제목과 본문 기간이 다르면 본문을 따른다
    quote_required: true
    sample_count: 10
    overlap: [early_failure, failed_after_months, expensive_for_lifespan]
    new_info: 라벨은 한 달을 기준으로만 나누고, 이 항목은 실제 개월 수(표본에서 1, 1.5, 2, 8, 9, 12개월)를 남겨 보증 기간과 견줄 수 있게 한다
    examples:
      - {review_id: R2SLSVNFPQPFQJ, quote: "It stopped working after nine months."}
      - {review_id: RGWGOEWT83E05, quote: "Stopped working after 1.5 months, sadly."}
    guide_use: [경쟁사 점수표, 시장 진입 조건]

  - id: use_duration
    name_ko: 리뷰를 쓸 때까지 쓴 기간
    kind: 2
    format: choice
    unit: null
    allowed_values:
      - {value: under_1_month, ko: "4주 미만(며칠, 한두 주, 3주)"}
      - {value: months_1_to_3, ko: "4주 이상 3달 미만"}
      - {value: months_3_to_6, ko: "3달 이상 6달 미만"}
      - {value: months_6_to_12, ko: "6달 이상 1년 미만"}
      - {value: year_1_plus, ko: "1년 이상"}
    definition: 리뷰를 쓸 때까지(또는 고장 나거나 그만둘 때까지) 기기를 쓴 기간. 리뷰가 적은 기간을 묶음으로 옮긴다
    fill_rule: 기간이 숫자나 분명한 말(a week, a month and a half, half a year, one year)로 있을 때만 채운다. "a few weeks", "for months", "a while"처럼 묶음을 정할 수 없으면 비운다. 횟수(3 treatments, 5th session)만 있으면 비운다. 산 날과 고장 난 날을 달 이름으로만 적으면(March, May) 리뷰가 그 기간을 따로 말할 때만 채운다
    quote_required: true
    sample_count: 53
    overlap: [keeps_using, no_effect, slow_results]
    new_info: 효과 없음이나 효과 늦음이 몇 주를 써 보고 한 말인지(4주 미만 리뷰 12개) 가를 수 있다. 라벨에는 사용 기간이 없다
    examples:
      - {review_id: R1S9BDFJ2QUC6U, quote: "I've been using this weekly for 9 weeks, and am seeing some results but not completely yet."}
      - {review_id: R299GBDZFNM22Q, quote: "Writing this review ONE YEAR after purchase - it barely works."}
    guide_use: [집중 분석]

  - id: usage_frequency
    name_ko: 사용 빈도
    kind: 2
    format: choice
    unit: null
    allowed_values:
      - {value: daily, ko: "매일(주 5회 이상)"}
      - {value: every_2_3_days, ko: "주 2~4회(이틀이나 사흘마다)"}
      - {value: weekly, ko: "주 1회"}
      - {value: less_than_weekly, ko: "2주 이상에 한 번"}
    definition: 리뷰어가 실제로 기기를 쓴 빈도
    fill_rule: 리뷰어가 자기가 쓴 빈도를 말할 때만 채운다. 설명서나 제조사가 권한 빈도("you only have to use it 2 times a week", "It's recommended to do weekly treatments")만 있으면 비운다. 시기마다 빈도가 달랐으면(처음 주 1회, 나중 주 2~3회) 둘 다 넣는다. 범위(2-3 times a week)는 그 범위가 든 값으로 넣는다
    quote_required: true
    sample_count: 22
    overlap: [demanding_schedule, light_schedule, works_with_consistency]
    new_info: 라벨은 일정이 부담이다, 가볍다는 평가만 세고, 이 항목은 실제 빈도를 남겨 효과와 함께 볼 수 있게 한다(매일 4, 주 2~4회 9, 주 1회 7, 그보다 드묾 3)
    examples:
      - {review_id: R18UY4HW9LQGON, quote: "My husband used it once a week for 16 weeks very meticulously and precisely"}
      - {review_id: R1MER6HMWWEBWK, quote: "I think I've been doing it daily for 3 months and just now noticed a huge difference."}
    guide_use: [집중 분석, 상세페이지 문구]

  - id: time_to_results
    name_ko: 효과가 처음 보인 때
    kind: 6
    format: choice
    unit: null
    allowed_values:
      - {value: sessions_1_to_3, ko: "1~3회 쓰고 보임"}
      - {value: sessions_4_plus, ko: "4회 이상 쓰고 보임"}
      - {value: weeks_under_4, ko: "4주 안에 보임"}
      - {value: months_1_to_3, ko: "4주 이상 3달 안에 보임"}
      - {value: months_3_plus, ko: "3달 이상 걸려 보임"}
    definition: 리뷰어가 털이 줄었다는 효과를 처음 알아챈 때를 횟수나 기간으로 말한 것
    fill_rule: '"after X", "took X before I realized", "finally starting", "since the first time"처럼 효과가 보이기 시작한 때를 말할 때만 채운다. 지금까지 쓴 기간과 지금의 결과만 말하면(9주 썼고 털이 줄었다) 비운다(use_duration이 담음). 횟수로 말하면 sessions 값, 기간으로 말하면 기간 값, 둘 다 있으면 기간 값. 범위(3-4 times)는 큰 쪽 묶음. 효과가 없었다는 리뷰는 비운다'
    quote_required: true
    sample_count: 13
    overlap: [quick_results, slow_results]
    new_info: 라벨은 빠르다, 늦다는 평가만 세고, 이 항목은 몇 회나 몇 주 만에 보였는지(1~3회 4, 4주 안 3, 3달 이상 2 등)를 남긴다
    examples:
      - {review_id: R2S5WD06YE4TMI, quote: "My underarms were basically hairless after 2 uses"}
      - {review_id: R3JNRN5BWUNUNO, quote: "It took at least three weeks before I realized that my hair wasn't growing back!"}
    guide_use: [상세페이지 문구, 소비자 기준표]

  - id: session_minutes
    name_ko: 한 번 시술 시간
    kind: 2
    format: number
    unit: 분
    allowed_values: []
    definition: 리뷰어가 말한 한 번 시술에 걸리는 시간(분). 어느 부위를 했는지는 인용에 남긴다
    fill_rule: 시간 숫자나 분명한 말(couple minutes는 2, nearly an hour는 60)이 있을 때만 채운다. 범위(30-45 minutes, 30 minutes to an hour)는 큰 값을 넣는다. 면도나 샤워를 함께 센 시간이라도 리뷰어가 한 번에 걸린다고 말한 그대로 넣는다. "takes forever", "hours"처럼 숫자가 없거나, 해 보지 않고 짐작한 시간(if I had the patience)은 비운다
    quote_required: true
    sample_count: 6
    overlap: [long_session, large_area_slow, quick_session, large_area_quick]
    new_info: 라벨은 오래 걸린다, 빠르다는 평가만 세고, 이 항목은 실제 분과 부위를 남겨 광고 문구(전신 10분)와 견줄 수 있게 한다
    examples:
      - {review_id: R1M9QNHVS55ACH, quote: "I get my whole toes, hands, arms, legs, stomach, bikini, and mustache areas done in about 30-45 minutes."}
      - {review_id: R3I3HAIAL07C08, quote: "a full session only takes about 10 minutes"}
    guide_use: [상세페이지 문구, 경쟁사 점수표]

  - id: intensity_setting
    name_ko: 쓴 출력 단계
    kind: 7
    format: choice
    unit: null
    allowed_values:
      - {value: highest, ko: "가장 높은 단계로 씀"}
      - {value: low_or_middle, ko: "가장 낮은, 낮은, 중간, 초보 단계로 씀"}
      - {value: raised_over_time, ko: "낮게 시작해 높임"}
      - {value: auto_recommended, ko: "센서 자동 조절이나 권장 단계 그대로 씀"}
    definition: 리뷰어가 실제로 쓴 출력(세기) 단계
    fill_rule: 리뷰어가 자기가 쓴 단계를 말할 때만 채운다. 단계 숫자만 있고 그 숫자가 가장 높은지 낮은지 리뷰에 없으면(level 9, temperatura en 7) 비운다(다른 리뷰나 원문 밖 지식으로 기기 단계 수를 짐작하지 않음). 처음 단계와 바꾼 단계를 함께 말하면(5에서 9로) raised_over_time, 그 끝이 가장 높은 단계라고 말하면 highest도 넣는다. 단계가 여럿 있다는 기능 소개, "높을수록 잘 된다" 같은 일반 관찰만 있으면 비운다
    quote_required: true
    sample_count: 12
    overlap: [high_setting_too_strong, fine_on_high_setting_or_sensitive_area, sensor_auto_adjust, handy_modes]
    new_info: 효과가 없었다는 리뷰가 가장 높은 단계로 써 본 것인지(표본 highest 5개 중 2개가 효과 없음)를 가를 수 있다. 라벨은 단계가 세다, 높아도 괜찮다는 통증 평가만 센다
    examples:
      - {review_id: R1TFI2Y1S0PDBG, quote: "after over 3 months of frequent use on the highest setting, it has done absolutely nothing to reduce hair."}
      - {review_id: R2VNEBLNFNGTZ1, quote: "Started at 5 but it was so painless I jumped up by third use."}
    guide_use: [집중 분석]

  - id: reviewer_skin_tone
    name_ko: 쓴 사람의 피부색
    kind: 7
    format: choice
    unit: null
    allowed_values:
      - {value: fair_light, ko: "밝은, 흰, 창백한 피부"}
      - {value: medium, ko: "중간 톤(중간에서 조금 어두운 피부 포함)"}
      - {value: dark, ko: "갈색이나 어두운 피부"}
    definition: 기기를 쓴 사람(리뷰어, 또는 리뷰에 적힌 가족)이 밝힌 자기 피부색. 쓴 사람이 여럿이면 사람마다 값 하나
    fill_rule: 리뷰가 피부색을 말로 밝힐 때만 채운다(light skin, fair, pale, medium skin tone, brown skin, piel súper clara). "suitable skin type", "met the skin colour requirement", "I'm not that dark", 출신이나 인종만 있으면 비운다. 몸의 일부가 어둡다는 말(비키니가 어둡다)은 사람의 피부색이 아니므로 비운다(area_result가 담음)
    quote_required: true
    sample_count: 15
    overlap: [skin_hair_suitability, dark_skin_tone]
    new_info: 스키마는 피부색을 배경으로만 말한 리뷰를 hair_reduction에 넣어 라벨로 세지 않는다. 이 항목은 효과를 말한 사람의 피부색(밝은 피부 12, 중간 3, 어두운 1)을 남겨 피부색별 효과를 볼 수 있게 한다
    examples:
      - {review_id: R20YZ6NU24ISYK, quote: "When it arrived, it would not work because my skin is too dark"}
      - {review_id: R3UUWNR9MDJHAI, quote: "a 60's-ish caucasian male with medium skin color"}
    guide_use: [소비자 기준표, 시장 진입 조건]

  - id: reviewer_hair_type
    name_ko: 쓴 사람의 털 색과 굵기
    kind: 7
    format: choice
    unit: null
    allowed_values:
      - {value: dark, ko: "검은, 진한 갈색, 갈색 털"}
      - {value: light_or_blonde, ko: "금발, 옅은 갈색, 붉은 털, 너무 옅은 털"}
      - {value: gray_white, ko: "흰 털이나 회색 털"}
      - {value: thick_coarse, ko: "굵고 억센 털"}
      - {value: fine, ko: "가는 털, 솜털"}
    definition: 기기를 쓴 사람이 밝힌 자기 털의 색과 굵기. 색과 굵기를 함께 말하면 둘 다, 쓴 사람이나 부위마다 다르면 각각 넣는다
    fill_rule: 리뷰가 털 색이나 굵기를 말로 밝힐 때만 채운다(dark hair, blond, gray, thick, coarse, vello grueso). 남에게 하는 조언("if you have thick stubborn hair maybe look for something else")만 있고 자기 털을 말하지 않으면 비운다. 털이 많다(hairy)는 양만 있으면 비운다. "Asian hair"처럼 색과 굵기를 알 수 없으면 비운다
    quote_required: true
    sample_count: 26
    overlap: [light_fine_hair, gray_white_hair, thick_coarse_hair]
    new_info: 라벨은 털 유형 때문에 안 된다고 말한 리뷰만 센다. 이 항목은 결과와 관계없이 쓴 사람의 털 유형(진한 털 17, 굵은 털 11 등)을 남겨, 맞는 유형인데도 효과가 없었다는 리뷰를 따로 볼 수 있게 한다
    examples:
      - {review_id: R17Y43JGIRI90P, quote: "I have thick, coarse Italian hair"}
      - {review_id: R1NE4QCL8NG603, quote: "I have pale skin and avoid the sun and brown and blond hairs."}
    guide_use: [소비자 기준표, 시장 진입 조건]

  - id: user_condition
    name_ko: 쓴 사람의 털과 피부 사정
    kind: 7
    format: choice
    unit: null
    allowed_values:
      - {value: hormonal, ko: "PCOS, 호르몬 문제, 임신 뒤 털이 늘었다고 말함"}
      - {value: ingrown_or_razor_bumps, ko: "인그로운 헤어, 면도 발진, 모낭 문제"}
      - {value: sensitive_skin, ko: "민감한 피부라고 말함"}
    definition: 기기를 쓴 사람이 밝힌, 제모기를 쓰게 된 털이나 피부 사정
    fill_rule: 리뷰가 그 사정을 쓴 사람의 일로 말할 때만 채운다. 기기 때문에 생긴 뾰루지나 자극은 이 항목이 아니다(safety). 털이 많다, 털이 고민이다처럼 원인을 말하지 않으면 비운다
    quote_required: true
    sample_count: 12
    overlap: [sensitive_skin_ok]
    new_info: 호르몬성 털(PCOS 등 6개)과 인그로운 헤어 고민(4개)을 가진 쓴 사람을 따로 셀 수 있다. 주제나 라벨에는 이 사정이 없고, sensitive_skin_ok는 민감한 피부에도 괜찮았다는 평가만 센다
    examples:
      - {review_id: R2R9O05EK9W6YR, quote: "I have PCOS so I grow dark hair everywhere"}
      - {review_id: RL2K07ZS9TAJN, quote: "I struggle with ingrown hairs and razor bumps no matter what."}
    guide_use: [소비자 기준표, 상세페이지 문구]

  - id: shaving_prep
