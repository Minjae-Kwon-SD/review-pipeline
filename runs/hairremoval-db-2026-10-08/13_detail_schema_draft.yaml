    kind: 7
    format: choice
    unit: null
    allowed_values:
      - {value: shaved_right_before, ko: "바로 전에 면도함"}
      - {value: shaved_day_before, ko: "전날 면도함"}
      - {value: stubble_left, ko: "털을 다 밀지 않고 씀"}
      - {value: shaved_timing_unstated, ko: "면도하고 썼지만 시점은 말하지 않음"}
    definition: 리뷰어가 시술 전에 면도를 언제 했는지, 털을 남긴 채 썼는지
    fill_rule: 리뷰어가 자기 면도 준비를 말할 때만 채운다(설명서 지시를 따랐다고 하면 그 시점으로). 같은 리뷰에서 시점이 바뀌었으면 둘 다 넣는다. 면도 횟수가 줄었다는 효과 이야기, 비교하려고 한쪽만 면도했다는 말은 비운다
    quote_required: true
    sample_count: 9
    overlap: [shaving_prep]
    new_info: 라벨 shaving_prep은 매번 면도해야 하는 번거로움만 센다. 이 항목은 면도 시점(바로 전 4, 전날 2)과 그때 생긴 일(남은 털 때문에 탄내, 따끔함, 반응)을 인용으로 남겨 사용 안내 문구에 쓴다
    examples:
      - {review_id: R2S5WD06YE4TMI, quote: "Be careful to shave right before using it - if you wait a day after shaving, some hair growth starts and that can cause a reaction from the IPL."}
      - {review_id: R1E8UGOQ0TAQSW, quote: "So I shaved my chin the day before so I had a tiny stubble peeping through but tried it any way."}
    guide_use: [상세페이지 문구]

