    name_ko: 아프거나 피부 반응이 난 부위
    kind: 1
    format: choice
    unit: null
    allowed_values:
      - {value: face_pain, ko: "얼굴에서 아픔"}
      - {value: face_reaction, ko: "얼굴에 피부 반응(화상, 변색, 발진, 자극)"}
      - {value: underarm_pain, ko: "겨드랑이에서 아픔"}
      - {value: underarm_reaction, ko: "겨드랑이에 피부 반응"}
      - {value: bikini_intimate_pain, ko: "비키니나 은밀한 부위에서 아픔"}
      - {value: bikini_intimate_reaction, ko: "비키니나 은밀한 부위에 피부 반응"}
      - {value: legs_pain, ko: "다리에서 아픔"}
      - {value: legs_reaction, ko: "다리에 피부 반응"}
      - {value: arms_pain, ko: "팔에서 아픔"}
      - {value: arms_reaction, ko: "팔에 피부 반응"}
      - {value: torso_pain, ko: "몸통에서 아픔"}
      - {value: torso_reaction, ko: "몸통에 피부 반응"}
      - {value: tattoo_or_spot_pain, ko: "문신이나 점 위에서 아픔"}
      - {value: tattoo_or_spot_reaction, ko: "문신이나 점 위에 피부 반응"}
    definition: 쏠 때 아프거나(pain) 시술 뒤 피부 반응(화상, 물집, 변색, 발진, 자극)이 났다고(reaction) 리뷰어가 부위를 짚어 말한 것
    fill_rule: 부위 이름과 아픔이나 피부 반응이 함께 있을 때만 채운다. 부위 없이 아프다, 데었다고만 하면 비운다. 아프다는 말 없이 느낌이 온다(feel it working)는 비운다. 두 부위를 견주어(팔보다 얼굴이 더 아프다) 말하면 더 아프다고 한 부위만 넣는다
    quote_required: true
    sample_count: 11
    overlap: [sensitive_area_pain, skin_burns, rash_bumps_allergy, pigment_scars, irritation_redness]
    new_info: 라벨은 민감한 부위가 아프다, 데었다는 사실을 세고, 이 항목은 어느 부위인지(얼굴 통증과 반응 4, 다리 반응 3 등)를 남겨 부위별 주의 문구와 헤드 설계에 쓴다
    examples:
      - {review_id: RX1GNKYNEYHW1, quote: "hurts less on the arms then it did on the face."}
      - {review_id: R2XB776KKIF8N9, quote: "I followed the instructions and this left blisters on my leg."}
    guide_use: [집중 분석, 상세페이지 문구]

  - id: desired_improvement
    name_ko: 바라는 개선
    kind: 3
    format: choice
    unit: null
    allowed_values:
      - {value: better_goggles, ko: "보안경을 넣거나 더 크고 잘 막는 보안경"}
      - {value: faster_flash, ko: "더 빠른 발광"}
      - {value: larger_head, ko: "넓은 부위용 더 큰 헤드"}
      - {value: storage_case, ko: "보관 케이스"}
      - {value: clearer_instructions, ko: "더 자세한 사용 안내"}
      - {value: works_on_dark_areas, ko: "어두운 부위에서도 쓸 수 있게"}
      - {value: other, ko: "그 밖의 바람"}
    definition: 리뷰어가 제품에 있었으면 하는 기능이나 상태를 바람, 요구로 말한 것
    fill_rule: '"should include", "I wish", "debería tener", "habría estado bien", "PLEASE offer"처럼 바라는 말이 있을 때만 채운다. 불만만 있고 바라는 상태가 없으면(설명서가 부족했다) 비운다. 새 버전이 더 빠르다며 아쉬워하면 faster_flash로 넣는다. 반품이나 환불을 바라는 말은 제품 개선이 아니므로 비운다'
    quote_required: true
    sample_count: 10
    overlap: [goggles_missing, goggles_poor_fit, small_window, slow_flash, case_lacking, unclear_instructions, dark_body_areas]
    new_info: 여러 주제에 흩어진 불만을 리뷰어가 직접 말한 바람 하나의 목록으로 모은다(보안경 3, 빠른 발광 2 등). 라벨은 불만을 세고 바라는 상태는 세지 않는다
    examples:
      - {review_id: R1QJ3XS7DRLDT5, quote: "Should include goggles or glasses with this."}
      - {review_id: RXBX1IOM03910, quote: "debería tener un aditamento más grande para piernas y brazos"}
    guide_use: [시장 진입 조건, 집중 분석]

  - id: comparison_reference
    name_ko: 비교 대상
    kind: 8
    format: choice
    unit: null
    allowed_values:
      - {value: professional_treatment, ko: "살롱, 클리닉, 메디스파의 전문 레이저 시술"}
      - {value: other_removal_method, ko: "면도, 왁싱, 트리머 같은 다른 제모 방법"}
      - {value: same_brand_other_model, ko: "같은 브랜드의 이전이나 다른 모델(Ulike Air 3, 새 버전 등)"}
      - {value: other_brand_device, ko: "다른 브랜드라고 밝힌 가정용 기기(Braun 등)"}
      - {value: other_product, ko: "다른 제품(브랜드나 모델을 알 수 없거나 같은 제품인지 가를 수 없는 비교 포함)"}
      - {value: same_product_before, ko: "리뷰어가 예전에 쓰거나 산 같은 제품(표본 0)"}
      - {value: store_purchase, ko: "매장(정규 매장, 백화점, 브랜드 공식 사이트)에서 산 같은 제품(표본 0)"}
      - {value: original_unspecified, ko: "어디서 온 기준인지 없이 정품, 원래 것이라고만 말한 기준(표본 0)"}
      - {value: dupe_target, ko: "듀프, 대체품, inspired by처럼 원조 관계를 말한 원조 제품(표본 0)"}
    definition: 리뷰어가 이 제품을 견준 대상. 대상마다 값 하나
    fill_rule: 이 제품과 견주는 말(더 낫다, 못하다, 만큼 세지 않다, 대신 하라, 보다 싸다, 비교하려고 한쪽만 면도했다)이 있을 때만 채운다. 비교 대상 하나에는 값을 하나만 넣고 가장 구체적인 값을 고른다(같은 브랜드 모델이면 same_brand_other_model, 다른 브랜드라고 밝히면 other_brand_device, 알 수 없으면 other_product). 예전 같은 제품을 정규 판매처(매장, 백화점, 브랜드 공식 사이트)에서 샀다고 말하면 store_purchase, 그 밖에 예전에 쓰거나 산 같은 제품이면 same_product_before, 어디서 온 기준인지 없이 "정품", "원래 것"만 말하면 original_unspecified. 같은 제품인지 다른 제품인지 원문으로 가를 수 없으면 other_product. dupe_target은 리뷰가 듀프, 대체품, "inspired by"처럼 원조 관계를 말할 때만 채우고 닮았다는 말만 있으면 other_product. 비교 대상이 서로 다르면(살롱과 면도) 대상마다 하나씩 넣는다. 다른 시술을 받아 왔다, 같은 브랜드를 써 봤다는 말만 있고 이 제품과 견주지 않으면 비운다. 정품이나 중고 의심 자체는 trust 주제(arrived_used 라벨)가 담으므로 넣지 않는다. 판정은 원문 밖 지식을 쓰지 않는다
    quote_required: true
    sample_count: 26
    overlap: [switch_brand, favorable_comparison, go_professional, saves_vs_salon, less_painful_than_alternatives, buy_again_or_upgrade]
    new_info: 라벨은 주제마다(가격, 통증, 브랜드) 비교를 따로 세고 대상 이름이 없다. 이 항목은 무엇과 견주었는지(전문 시술 10, 다른 제모 방법 5, 같은 브랜드 다른 모델 4, 다른 브랜드 2, 알 수 없는 다른 제품 5)를 한 목록으로 센다
    examples:
      - {review_id: R4N2FP3FJ4PMC, quote: "mientras que la Braun el primer mes lo usas una vez por semana y listo"}
      - {review_id: R1A6DQ2G52XFX2, quote: "It is not as strong as a salon laser removal device"}
    guide_use: [경쟁사 점수표, 상세페이지 문구]

