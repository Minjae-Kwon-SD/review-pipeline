      notes: "미국 공식 페이지(us.braun.com)를 먼저 썼다. 전원, 전신 주 1회 10분 문장, 피부 적합 문장, 가격은 같은 모델(PL5137)의 영국 Braun 공식 상점(braunshop.co.uk, 운영은 THG Ingenuity가 Braun 대신 함)에서 가져왔고 영국판 구성은 정밀 헤드, Venus 면도기, 파우치로 미국판과 거의 같다. 영국 페이지의 '4-12 weekly sessions 10 minutes each'는 상품 그림의 대체 글자(alt)에만 있어 검사에서 버려졌고, 같은 페이지 본문 문장(전신 주 1회 10분)으로 바꿨다. 그래서 처음 몇 주(4-12회) 일정은 본문 글자로 확인하지 못했다. 미국 페이지 구성품 목록(What's in the box)은 항목 사이에 'Loading' 글자가 끼어 있어 한 줄로 이으면 페이지 글자와 맞지 않으므로, 제목 줄(2 Caps and Leather Pouch)과 목록 줄마다 따로 적었다. 가격은 영국 파운드라 미국 가격이 아니다(미국 공식 페이지에는 상품 가격 글자가 없고, 있는 $430은 살롱 비용 비교 문구라 쓰지 않음). FDA 문장은 PL5137이 목록에 든 Silk Expert Pro 5(PL5XXX, 6031) 지원 페이지의 브랜드 전체 문장이다. 쓸 수 있는 피부색과 털 색 표(Fitzpatrick 등)는 미국 페이지에서 그림('Overview of suitable and unsuitable skin and hair colors')으로만 있어 적지 않았다. 발광 간격, 창 크기(cm²)는 찾지 못해 flash_speed_window에는 헤드 수(2 Caps)만 적었다. 'Visible results in just 2 sessions' 문장은 각주 숫자가 붙어 글자 맞추기가 흔들릴 수 있어 쓰지 않았다. 냉각 기능은 공식 페이지에 언급이 없다."
