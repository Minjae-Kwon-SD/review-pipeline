      notes: "Ulike 미국 공식 사이트(ulike.com)는 상품 설명을 스크립트로 그려 페이지 글자에 사양이 거의 없다(상단 띠의 환불 보장과 메뉴의 가격만 글자로 있음). 그래서 미국과 캐나다 소매점(Ulta, The Brick)과 Ulike 호주 공식 사이트(au.ulike.com, 같은 Air 10 상품 페이지)를 썼다. 호주 페이지의 가격($699.00)은 통화 표시가 없어 적지 않았고, 호주 규제 표시(ARTG)와 호주 보증 문구도 미국판 값이 아니라서 쓰지 않았다. The Brick 가격($499.99)도 캐나다 달러 표시가 없어 적지 않았다. 발광 간격은 두 값(호주 공식 0.25초 자동 발광, The Brick의 Fast 모드 0.5초)이 페이지마다 다르게 적혀 있어 둘 다 그대로 적었다. 에너지도 23.6 J/cm²(The Brick)와 26J 총 에너지(호주 공식)로 단위가 다르다. 피부색과 털 색 표는 Ulta에서 'skin and hair tone chart'를 보라고만 하고 표는 그림이라 Fitzpatrick 범위는 적지 않았다. Ulta 가격 $349.00은 정가 줄이고 할인가($261.75)는 적지 않았다. 유선, 무선과 배터리 정보는 찾지 못했다."
