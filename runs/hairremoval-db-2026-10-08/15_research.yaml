notes:
  - "quote는 WebFetch 요약 모델이 페이지에서 옮긴 문장이다. 가이드에 쓰기 전 research.py check로 다시 열어 대조할 것."
  - "ind_ 중 '\"title\":...,\"price\":...' 형태의 quote는 브랜드 공식 Shopify 상품 JSON(<상품 URL>.json)의 변형 이름과 가격 필드 원문이다(문장이 아니라 필드 값). 상품 이름은 같은 JSON의 title 필드에서 확인했다."
  - "fda.innolitics.com은 FDA 510(k) 요약을 정리해 보여 주는 제3자 사이트다. 'Bench testing only. No clinical data provided.' 같은 문장은 그 사이트의 정리 문장이므로 FDA 원문(accessdata.fda.gov PDF)과 대조가 필요하다(PDF는 이번에 글자로 읽지 못함)."
  - "시장 보고서 숫자는 대부분 전 세계 값이다. 미국만의 가정용 IPL, 레이저 제모기 시장 규모는 공개 요약에서 찾지 못했다(not_found 참고)."
  - "amazon.com 페이지는 열지 않았다."
