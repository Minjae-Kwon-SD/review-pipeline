topic: design
directions:
  negative:
    labels:
      - id: bulky_heavy
        name_ko: 크고 무거움
        name_en: Bulky or heavy
        include: 기기가 크다, 부피가 크다, 무겁다, 커서 다루기 힘들다, 오래 들고 있으면 지친다는 말(크기나 무게 단어가 있을 때)
        exclude: 크기나 무게 말 없이 모양, 손잡이, 각도, 버튼 위치 때문에 쥐기 불편하다는 말은 awkward_grip. 조사창이 작다는 말은 small_window
        examples:
          - {review_id: R6YW7XS4EI7QZ, quote: "The design of this Ulike IPL is definitely on the bulky and heavy side"}
          - {review_id: RYFKQTK5JPNJS, quote: "It is bulky and heavy to hold for extended sessions."}
        approx_count: 15
      - id: awkward_grip
        name_ko: 모양이 쥐기 불편함
        name_en: Awkward shape or grip
        include: 모양, 손잡이, 인체공학이 어색하다, 각도를 바꿀 때 불편하다, 쥐는 곳에 버튼이 있다, 디자인이 이상해 조작하기 어렵다는 말
        exclude: 크거나 무거워서 다루기 힘들다는 말은 bulky_heavy(크기, 무게와 모양을 함께 말하면 둘 다). 조작 방법, 모드, 설명서는 ease_of_use라 이 주제가 아님
        examples:
          - {review_id: R1W4CHDH2UJAL2, quote: "the hairdryer-style hand grip design is awkward when you’re switching angles across different body parts"}
          - {review_id: R3O6K913ALP80R, quote: "Awkward to hold, some buttons are where you hold."}
        approx_count: 11
      - id: not_cordless
        name_ko: 무선이 아니라 꽂아 써야 함
        name_en: Not cordless
        include: 무선인 줄 알았다, 충전식이었으면 좋겠다, 꽂아야만 켜진다, 들고 다닐 수 없다는 말
        exclude: 코드가 짧다, 어댑터가 크다는 말은 cord_adapter. 배터리가 금방 닳는다는 말은 기타
        examples:
          - {review_id: R2MI0HOHIKSDB6, quote: "Must stay plugged in, not portable at all."}
          - {review_id: R2R1PSHBBGVQA5, quote: "was expecting cordless, unfortunately I could not find cordless"}
        approx_count: 7
      - id: cord_adapter
        name_ko: 코드가 짧거나 어댑터가 큼
        name_en: Short cord or bulky power adapter
        include: 전원 코드가 짧다, 전원 어댑터가 크고 무겁다는 말
        exclude: 무선이 아니라는 불만 자체는 not_cordless
        examples:
          - {review_id: RMZHMMCWOCAS9, quote: "I found the cable to be a bit short"}
          - {review_id: R2MBCDJ6VJPRMQ, quote: "Its power supply is about as large as unit itself, and definitely heavier"}
        approx_count: 3
      - id: noisy
        name_ko: 작동 소음이 큼
        name_en: Loud operating noise
        include: 팬 소리가 크다, 발광할 때 나는 소리가 거슬린다는 말
        exclude: 발광이 느리다, 빠르다는 말은 treatment_time
        examples:
          - {review_id: R2EDE4DS2YX5SP, quote: "there is a loud fan noise so you can't really do while you watch TV at your normal level"}
          - {review_id: R1E8UGOQ0TAQSW, quote: "a fan comes on and it is noticeably loud"}
        approx_count: 5
      - id: small_window
        name_ko: 조사창이 작음
        name_en: Treatment window too small
        include: 조사창이나 헤드가 작다, 넓은 부위용으로 더 큰 헤드가 있었으면 한다는 말
        exclude: 헤드가 작아 시간이 오래 걸린다는 시간 불만은 treatment_time. 작은 부위용으로 더 작은 헤드를 원하는 말은 기타. 기기 몸체가 크다는 말은 bulky_heavy
        examples:
          - {review_id: R2SGB5RDA6XE9, quote: "I wish it was bigger to treat large areas"}
          - {review_id: R35T6O9HV1N4EB, quote: "I wish the laser head was a tad bit bigger"}
        approx_count: 6
    other_approx_count: 4
    notes: 크기, 무게와 모양을 함께 말한 인용(heavy and awkward to hold 등 3개)은 bulky_heavy와 awkward_grip 둘 다 붙는다. 기타는 작은 부위용 더 작은 헤드 요구 2개, 조사면이 평평해 몸 곡선에 안 맞음 1개, 배터리가 중간에 닳음 1개.
  positive:
    labels:
      - id: looks_good
        name_ko: 예쁘고 고급스러운 외관
        name_en: Attractive, premium look
        include: 예쁘다, 세련됐다, 고급스러워 보인다, 색(보라색 등)이 예쁘다, 디자인이 좋다는 말
        exclude: 손에 쥐는 느낌과 무게는 light_easy_grip. 만듦새, 튼튼함 자체는 quality라 이 주제가 아님
        examples:
          - {review_id: R2IBA63SK8LQIJ, quote: "The device itself is very sleek and beautiful."}
          - {review_id: R2PNK8AF14NNHH, quote: "the purple color is beautiful too"}
        approx_count: 23
      - id: light_easy_grip
        name_ko: 가볍고 쥐기 편함
        name_en: Lightweight and easy to hold
        include: 가볍다, 무겁지 않다, 손에 잘 맞는다, 쥐기 편하다, 다루기 쉽다, 인체공학적이다는 말
        exclude: 작아서 자리를 덜 차지하거나 들고 다니기 좋다는 말은 compact_portable. 조작 방법이 쉽다는 말은 ease_of_use라 이 주제가 아님
        examples:
          - {review_id: RSUV6NFE2R8FB, quote: "It is lightweight and easy to hold."}
          - {review_id: R3NJ191QCXHU60, quote: "The device is lightweight, comfortable to hold"}
        approx_count: 18
      - id: compact_portable
        name_ko: 작고 휴대하기 좋음
        name_en: Compact and portable
        include: 작다, 자리를 덜 차지한다, 여행에 들고 가기 좋다, 휴대성이 좋다, 크기가 작아 겨드랑이나 얼굴 같은 부위에 좋다는 말
        exclude: 무게와 쥐는 느낌은 light_easy_grip(작아서 쥐기 쉽다면 둘 다)
        examples:
          - {review_id: RNCOGXWS6VCM2, quote: "It’s compact and doesn’t take up much space, so I can easily take it with me if I travel."}
          - {review_id: R1CY0LPVYGLF0R, quote: "very portable"}
        approx_count: 7
      - id: long_cord
        name_ko: 전원 코드가 넉넉함
        name_en: Long enough power cord
        include: 전원 코드가 길다, 충분히 길어 움직이기 편하다는 말
        exclude: 무선이 아니라는 불만은 부정 방향
        examples:
          - {review_id: R11D1ULS8PBPOD, quote: "Plugs in and cord is long enough to use the tool with plenty of room."}
          - {review_id: R17Z3G31WY4J6A, quote: "The 6ft cord a nice length"}
        approx_count: 4
      - id: attachments_versatile
        name_ko: 부위별 교체 헤드
        name_en: Interchangeable heads for body areas
        include: 부위별 교체 헤드가 여럿 들어 있어 여러 부위에 쓸 수 있다는 말
        exclude: 보안경, 면도기, 케이스 같은 구성품은 accessories라 이 주제가 아님
        examples:
          - {review_id: R2527CST84MMJT, quote: "The multiple attachments make it versatile for different body areas"}
          - {review_id: R3AL97KPZJMJ8N, quote: "I like that it has a broad area head and a smaller area head that you can change"}
        approx_count: 4
    other_approx_count: 2
    notes: 기타는 생각보다 컸지만 괜찮다는 혼합 인용 1개와 커서 넓은 부위가 빨랐다는 인용 1개(시간 이야기에 가까움).
