audit:
  stage: details
  run: hairremoval-db-2026-10-08
  overall_status: FAIL
  summary: "표본 150행 중 FAIL 4행, UNVERIFIED 1행. FAIL은 피부색 판정으로 발광을 막은 일을 skin_sensor 고장으로 넣은 1행, 면도 직후를 shaved_timing_unstated로 넣은 2행, 고장이 없었다면 걸렸을 가정의 시간을 session_minutes로 넣은 1행. 작업자가 남긴 경계 사례는 boundary_cases에 따로 적음(표본 밖이라 findings에 넣지 않음)."
  checked: 150
  findings:
    - {review_id: R3806RF3C4GFDU, item: failed_component, value: skin_sensor, status: FAIL, finding: "원문 'it read my skin tone as being too dark'는 센서가 피부를 읽고 피부색이 너무 어둡다고 판정해 발광을 막은 일이다. 값 skin_sensor(피부 접촉 센서가 피부를 더는 읽지 못함)와 맞지 않고, 승인 스키마 fill_rule은 피부색 때문에 센서가 막는 것은 고장이 아니므로 비운다고 한다. 리뷰어도 'either the machine is faulty, or the skin tone sensor is too sensitive'라며 고장이라고 단정하지 않는다", required_action: "failed_component skin_sensor 행 삭제(이 리뷰의 failed_component는 비움)"}
    - {review_id: R2JLMBJIYIWMGE, item: shaving_prep, value: shaved_timing_unstated, status: FAIL, finding: "'I shower, properly exfoliate, shave, then use the device on clean, dry skin'은 한 번의 순서 안에서 면도한 뒤 바로 쓴다는 말이라 시점이 드러나 있다. shaved_timing_unstated가 아니라 shaved_right_before", required_action: "값을 shaved_right_before로 바꿈(인용은 그대로)"}
    - {review_id: R1QI4OU4RUYZYN, item: shaving_prep, value: shaved_timing_unstated, status: FAIL, finding: "'I'd shave the whole leg in the shower then just try to be as thorough as possible'은 샤워 중에 면도하고 이어서 기기를 쓴다는 말이라 시점이 바로 전이다. 같은 리뷰에 이미 shaved_right_before('dry shave the sections ... immediately go over it with the device')가 있으니, 시점이 바뀌어 두 값이 되는 경우가 아니라 같은 값이 겹친 것이다", required_action: "shaved_timing_unstated 행 삭제(shaved_right_before 하나만 남김)"}
    - {review_id: R2RV3OA74QI57P, item: session_minutes, value: 10, status: FAIL, finding: "'instead of a leg taking 5/10 minutes it ends up taking way longer because you have to constantly turn it off and on'에서 5~10분은 기기가 멈추지 않았다면 걸렸을 시간이고, 실제 걸린 시간은 숫자 없이 'way longer'다. fill_rule은 숫자가 없거나 해 보지 않고 짐작한 시간은 비운다고 한다", required_action: "session_minutes 행 삭제"}
    - {review_id: R2TNKBB9DW6MXY, item: session_minutes, value: 5, status: UNVERIFIED, finding: "'I'll be ready in five minutes' 앞뒤에 부위나 시술 이야기가 없어, 한 번 시술에 실제로 걸린 시간인지 원문만으로 가를 수 없다(어느 부위인지도 없음)", required_action: "민재님 확인. 실제 시술 시간으로 보지 않으면 행 삭제"}
  boundary_cases:
    note: "작업자가 경계가 애매하다고 남긴 곳. 승인 스키마 failed_component fill_rule('피부색이나 어두운 부위 때문에 센서가 막는 것은 고장이 아니므로 비운다')과 값 설명으로 판정함. config/detail_rules.yaml에는 failed_component, area_result에 걸리는 규칙이 없음. R3806RF3C4GFDU는 표본에 있어 위 findings에 적음."
    items:
      - {review_id: RJC5BCQ7RHKDP, item: failed_component, value: skin_sensor, in_sample: false, status: UNVERIFIED, finding: "'Stopped working after less than a year. The SensoAdapt turns red and white every time you try to use it requiring you to unplug it to reset.' 매번 그렇고 전원을 뽑아 재설정해야 한다고 하니 피부색 때문에 막힌 것이 아니라 기기 이상이다(피부색 제외 규칙에 걸리지 않음). 그러나 SensoAdapt가 피부 접촉 센서라는 말은 원문에 없어 이름에서 짐작해야 하고(원문 밖 지식), 센서가 피부를 읽지 못한다는 말도 없다", required_action: "민재님 판단: SensoAdapt 표시가 빨강과 흰색을 오가는 것을 skin_sensor로 셀지. 세지 않는다면 발광이나 전원 언급도 없어 다른 값에도 맞지 않으므로 failed_component를 비움"}
      - {review_id: R2HTPKGOEZ3WN7, item: failed_component, value: skin_sensor, in_sample: false, status: FAIL, finding: "'it won't flash because it is reading red. I can use it in one area and it works, I move an inch over and it reads red'는 센서가 피부를 읽고 자리마다 빨강으로 판정해 막는다는 말이다. 고장 났다거나 예전엔 됐는데 이제 안 된다는 말이 없고(별 4개, 'Well worth the money'), 'The most frustrating part'라고 한 사용상의 불편이다. 값 skin_sensor(센서가 피부를 더는 읽지 못함)에 맞지 않고, 빨강 판정이 피부색 때문이라면 fill_rule상 비운다", required_action: "failed_component skin_sensor 행 삭제"}
      - {review_id: R3806RF3C4GFDU, item: failed_component, value: skin_sensor, in_sample: true, status: FAIL, finding: "표본 findings와 같음. 센서가 피부를 읽고 피부색이 어둡다고 막은 일이며, 리뷰어 스스로 고장인지 센서가 예민한 것인지 정하지 못함", required_action: "행 삭제"}
      - {review_id: R2Z9MITKBORPPL, item: area_result, value: face_works, in_sample: false, status: UNVERIFIED, finding: "얼굴 효과는 원문에 있다('my man says that even though instructions say not to use it for that, it did work and just took longer to see an effect'). 다만 리뷰어 본인이 아니라 남편(파트너)의 결과다. area_result 정의는 '리뷰어가 몸의 부위를 짚어'라고만 해 누구 몸인지 정하지 않았고, reviewer_skin_tone이나 reviewer_hair_type처럼 '리뷰에 적힌 가족'을 넣는다는 말도 없다. 공통 경계 규칙에도 없음. 지금 인용 'for anyone looking at male facial hair removal, it will work.'는 남에게 하는 일반 조언이라 누구의 결과인지 드러나지 않음", required_action: "민재님 결정: area_result에 리뷰어가 아닌 사용자의 결과를 넣을지. 넣는다면 인용을 'my man says that even though instructions say not to use it for that, it did work and just took longer to see an effect'로 바꿈. 넣지 않는다면 행 삭제"}
  next_action: HUMAN_REVIEW_REQUIRED
