      required_action: "'워싱턴주는 특정 독성 물질을 제한하며 [r:reg_13], 그 물질이 향료 조성물(고정제 등) 안에 들어 있어도 의도적으로 넣은 것으로 본다 [r:reg_14]'로 고친다."
