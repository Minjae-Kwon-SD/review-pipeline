audit:
  stage: details
  run: perfume-db-2026-10-07
  checked: 150
  findings:
    - {review_id: R2ELX8HNB56901, item: desired_state, value: "다른 향", status: FAIL, finding: "원문 'I just wanted a different fragrance, this was nice a reasonably priced.'는 평소와 다른 향으로 바꿔 보고 싶었고 이 제품으로 그 바람이 채워졌다는 말이다. 값 '다른 향'은 이 제품과 다른 향을 바란다는 불만으로 읽혀 뜻이 뒤집힌다", required_action: "값을 '평소와 다른 새 향'으로 바꾸기"}
    - {review_id: R119ZEC687SHW0, item: desired_state, value: "제품이 마음에 들기를 기대함", status: FAIL, finding: "'I was really hoping that I would love it'은 마음에 들기를 바랐다는 일반적인 말이고, 정의가 요구하는 '바라거나 기대한 상태나 기능'(부드러운 향, 작은 용량 등)이 없다. 원문의 나머지는 '너무 세다'는 불만뿐이고, 규칙상 불만에서 바람을 짐작해 채우지 않는다", required_action: "desired_state 비우기"}
    - {review_id: RSKN6VFI7IWZF, item: usage_occasion, value: carry_travel, status: FAIL, finding: "원문은 'Bottle leaks all over. For a travel bottle it's terrible'뿐이다. 여행용 병으로서 나쁘다는 평가이고, 리뷰어가 들고 다니거나 여행에 가져갔다는 말은 없다. 규칙상 병 크기 평가만 있고 들고 다닌다는 말이 없으면 비운다", required_action: "usage_occasion 비우기"}
    - {review_id: RY81CPM5RECR, item: application_site, value: clothing, status: FAIL, finding: "인용 'lasted ages, especially on my clothes'는 예전에 산 1.7oz 병 이야기다('At first I bought the 1.7 ounce bottle ...'). 규칙상 예전 병 이야기는 넣지 않는다. 값 clothing은 이번 3.3oz 병에 대한 'I soaked a sleeve with some of the contents of the bigger bottle'로 뒷받침된다", required_action: "값은 clothing으로 두고, 인용을 'I soaked a sleeve with some of the contents of the bigger bottle'로 바꾸기"}
    - {review_id: R172WXNSN0NRNX, item: longevity_hours, value: 0.017, status: UNVERIFIED, finding: "'doesn't last put a minute'은 'doesn't last but a minute'(금방 사라진다)라는 과장 관용구다. 규칙대로 1분 = 0.017로 바꿨지만, 실제 지속 시간인지 과장인지 원문으로는 정할 수 없다. 스키마에도 과장 표현을 다루는 규칙이 없다. 시간 분포와 중앙값에 극단값으로 들어간다", required_action: "민재님이 과장 관용구('but a minute' 등)를 숫자로 넣을지 비울지 정하고 fill_rule에 적기"}
    - {review_id: R1CX3R6UQLOFAJ, item: desired_state, value: "환상적인 향", status: UNVERIFIED, finding: "'I bought this in hopes that it would smell fantastic'은 바람을 직접 말한 것은 맞다. 다만 구체적인 상태 없이 좋은 향이길 바랐다는 일반적인 기대이고, 이런 일반 기대를 채울지 스키마가 정하지 않았다. 원문의 실제 불만은 노년 이미지('older women smell')이다", required_action: "민재님이 일반 기대('좋은 향', '마음에 들기를')를 desired_state에서 뺄지 정하기. 빼면 이 값 비우기"}
