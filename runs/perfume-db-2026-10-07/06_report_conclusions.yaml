conclusions:
  1: "태그를 그대로 세면 부정이 더 많지만 실제 별점 분포로 되돌리면 긍정 77.5%, 부정 15.8%로 뒤집히므로, 원본 수는 불만의 내용으로, 가중 비율은 그 불만이 얼마나 흔한지로 읽습니다."
  2: "리뷰어가 가장 많이 말한 속성은 향, 그리고 지속력과 향의 세기이며, 둘 가운데 지속력과 향의 세기는 부정 비율이 69.0%로 향(35.7%)보다 높습니다."
  3: "전체 만족도를 빼면 실제 별점 구성으로 부정 언급 리뷰어(가중)가 가장 많은 주제는 지속력과 향의 세기(10.0%)이고, 고객 응대는 가중 부정 비율 83.0%로 언급되면 대부분 불만이지만 부정 언급 리뷰어(가중)는 1.8%로 드뭅니다."
  4: "그 주제를 부정으로 언급한 리뷰와 나머지 리뷰의 별점 격차는 고객 응대(-3.27)가 가장 크고, 부정 언급이 가장 많은 지속력과 향의 세기는 격차 -1.62로 별점과 덜 강하게 묶여 있으며, 이는 함께 나타나는 관계일 뿐 원인은 아닙니다."
  5: "부정 태그 안에서는 지속력과 향의 세기와 향이 네 기간 모두 상위 두 주제이지만, ~2024년 표본에 5★ 리뷰가 0개이고 가중 부정(1,2★)이 20.0%인 것처럼 기간마다 표본 구성이 크게 달라 기간 사이 차이를 추세로 읽지 않습니다."
  6: "부정 쌍은 지속력과 향의 세기 + 신뢰(83), 긍정 쌍은 브랜드 경험 + 향(101)이 가장 많지만, 신뢰가 든 쌍에는 태깅 규칙도 함께 작용하고 모두 같은 리뷰에 함께 나온다는 뜻일 뿐 원인 관계는 아닙니다."
  7: "확인된 구매와 확인 안 된 구매(40개)는 평균 별점과 1~2★ 비율이 비슷하고 Vine은 리뷰 20개뿐이라 해석하지 않으며, 도움돼요 불만 순위는 소수 리뷰가 받은 표에 크게 기댑니다."
  9: "ASIN 6개 모두 가장 큰 강점은 향이고 Jean Paul Gaultier를 뺀 나머지는 가장 큰 약점이 지속력과 향의 세기이지만(리뷰를 다시 뽑아 보면 이런 ASIN은 3~5개), ASIN당 표본 리뷰 114~399개라 ASIN 사이의 차이를 순위로 읽지 않습니다."
