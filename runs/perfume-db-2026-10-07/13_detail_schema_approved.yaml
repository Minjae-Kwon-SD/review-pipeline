edits:
  split_values:
  - item: purchase_context
    value: first_or_blind_buy
    into:
    - *id001
    - *id002
    rule: 처음 산다는 말은 first_purchase, 맡아 보거나 시험해 보지 않고 샀다는 말은 blind_buy. 둘 다 말하면 둘 다 채운다.
  extra:
  - item: scent_note
    field: note_word
    when_value: other
    format: text
    rule: 값이 other이면 extra.note_word에 원문 낱말을 그대로(짧게) 적는다.
