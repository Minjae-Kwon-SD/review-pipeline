      labels:
      - id: smells_good_general
        name_ko: 향이 좋음(이유 없음)
        name_en: Smells good (no specifics)
        include: 노트나 성격 묘사 없이 향이 좋다, 사랑한다("Smells good", "Love the scent", "Great fragrance", "Huele bien"). 혼합 인용의 좋다는 부분도 여기
        exclude: 노트, 분위기, 인상을 말하면 appealing_character, 남의 반응은 compliments
        examples:
