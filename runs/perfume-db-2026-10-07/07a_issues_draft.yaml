          quote: Smells amazing!!
        - review_id: R4HVFOK3EB74D
          quote: It's a gorgeous, wonderful scent
        approx_count: 115
      - id: appealing_character
        name_ko: 노트나 분위기가 좋음
        name_en: Likes the notes or character
        include: 좋아하는 노트, 분위기, 인상을 말함(따뜻하다, 달다, 크리미하다, 깨끗하다, 상쾌하다, 가볍다, 무겁지 않다, 꽃향, 바닐라, 남성적이다, 여성스럽다, 섹시하다, 비싸 보인다, 싸 보이지 않는다)
        exclude: 묘사 없는 칭찬은 smells_good_general, 지속력이나 세기 평가는 이 주제가 아님
        examples:
