audit:
  stage: details
  run: perfume-db-2026-10-07
  checked: 20
  findings:
    - {review_id: RZQ65YUM4X972, item: purchase_context, value: repurchase, status: FAIL, finding: "인용 'Will repurchase again.'은 앞으로 다시 사겠다는 말이다. repurchase는 '예전에 산 적 있음, 오래 써 온 제품'이고, fill_rule도 앞으로의 일('would make a great gift')은 비우라고 한다. 본문의 'Same price as it was at Ulta'는 Ulta 값과 견준 말일 뿐 그곳에서 산 적이 있다는 말이 아니다. 예전에 산 적이 있다는 근거가 원문에 없다", required_action: "이 값(purchase_context repurchase) 줄을 지우기"}
    - {review_id: R2TKJ2MHOHLZAT, item: comparison_reference, value: original_unspecified, status: FAIL, finding: "'Creo que no es.original'(정품이 아닌 것 같다)은 비교하는 말이 아니라 정품이 아니라는 단정이다. fill_rule은 비교하는 말이 있을 때만 채우라고 하고, 정품 의심은 비교가 있을 때 함께 채울 수 있다는 뜻이다. 이 리뷰의 비교는 제목 'No huele como siempre'뿐이고, 그것은 이미 same_product_before 줄로 들어가 있다", required_action: "이 값(comparison_reference original_unspecified) 줄을 지우고 same_product_before 줄만 남기기"}
    - {review_id: R3DPCZ2ZZXKCWL, item: comparison_reference, value: original_unspecified, status: FAIL, finding: "'Does not smell like the original.' 바로 뒤에 'They changed the smell of Eternity. Used to be my favorite perfume back in the 90's.'가 이어져, 'original'이 예전 향(예전 제조법)이라고 밝혀져 있다. original_unspecified는 '무엇인지 밝히지 않은 원래 것'이라 맞지 않고, 같은 비교 기준이 same_product_before 줄('Used to be my favorite perfume back in the 90's.')로 이미 들어가 있어 두 번 세게 된다", required_action: "이 값(comparison_reference original_unspecified) 줄을 지우기. same_product_before와 other_product 줄은 그대로 두기"}
    - {review_id: R32N897R5VUT5J, item: comparison_reference, value: store_purchase, status: UNVERIFIED, finding: "인용은 'from Glossiers website'로, 실제 매장이 아니라 브랜드 공식 온라인 판매처다. store_purchase의 정의는 '매장(정규 매장, 백화점)에서 산 같은 제품'이라 공식 웹사이트가 들어가는지 정의만으로 정할 수 없다. 같은 인용의 'I've purchased YOU before'는 same_product_before를 분명히 뒷받침하는데, 이 리뷰에는 그 값이 없다", required_action: "담당자가 공식 웹사이트를 store_purchase에 넣을지 정하기. 넣지 않으면 same_product_before로 바꾸고, 넣으면 같은 인용으로 same_product_before 줄도 추가하기"}
    - {review_id: R3A9OC9DUVF1M, item: comparison_reference, value: same_product_before, status: UNVERIFIED, finding: "'es mas suave que otro que tenía'(전에 갖고 있던 다른 것보다 순하다)의 'otro'가 같은 향수(Eternity)의 예전 병인지 다른 향수인지 원문에 나오지 않는다. 같은 향수라면 same_product_before, 다른 향수라면 other_product이고 원문만으로는 가릴 수 없다", required_action: "사람이 확인해 same_product_before로 둘지 other_product로 바꿀지 정하기"}
