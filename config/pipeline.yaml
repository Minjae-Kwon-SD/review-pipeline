# 파이프라인 설정. 스크립트(collect.py, check_inputs.py, weight.py)가 읽는다.

paid:
  # 유료 수집(amz-review scrape_reviews, Apify 크레딧 소모). true이고 collect.py pull에 --confirm-paid가 있을 때만 부른다.
  enabled: false
  max_pages_per_star: 1     # ASIN과 별점 조합마다 받을 페이지 수(1~10)
  max_scrape_calls: 10      # 이 회차 raw/paid_calls.jsonl 전체의 scrape_reviews 최대 횟수(시험 호출 포함, 별점마다 부르면 ASIN당 5번)
  max_asins: 10             # 유료로 받을 ASIN 수 상한(2026-10-10 담당자 결정 "허용(10개까지)")
  concurrency: 4            # 동시 호출 수(호출 수와 비용은 같고 시간만 줄어듦). 2026-10-12 담당자 결정 1에서 4로
  split_by_star: true       # ASIN x 별점마다 한 번씩 부름(다섯 별점을 한 번에 부르면 시간 초과 위험, mcp_tools.md 경고)
  scrape_below_db_reviews: 100   # --paid-asins가 없을 때 공유 DB 리뷰가 이보다 적은 selected만 유료로 받음(0이면 selected 전부)

weighting:
  # 별점 묶음 보정. 묶음 안 별점이 모두 표본을 가지면 별점마다, 하나라도 비면 묶음 단위로 가중치를 만든다.
  groups:
    negative: [1, 2]
    neutral: [3]
    positive: [4, 5]
  min_group_sample: 30       # 묶음 표본이 이보다 적으면 경고
  max_review_share: 0.02     # 리뷰 한 개의 가중치가 그 ASIN 가중 합(= 표본 수)에서 차지하는 비중 w(s)/n이 이보다 크면 경고
  dist_mean_tolerance: 0.15  # 실제 분포로 계산한 평균과 average_rating 차이가 이보다 크면 경고
