# 설계 정보 항목의 공통 경계 규칙. 품목(카테고리)에 묶이지 않는다.
# 2026-10-08 담당자 결정(16:22 KST)으로 정함. 우리 감사자와 GPT 독립 판정이 갈린 26칸(docs/compare_v2_result.md)의 경계.
# 다음 실행부터 적용한다. 향수 회차(perfume-db-2026-10-07)의 승인 스키마와 추출값은 예전 규칙으로 만든 것이라 바꾸지 않았다.
#
# 쓰는 곳:
# - scripts/stage_packet.py detail: 작업 파일의 '공통 경계 규칙' 절에, 맡은 항목(items)이 하나라도 걸린 규칙만 원문 그대로 넣는다.
#   승인 스키마에 그 이름의 항목이 없으면 그 규칙은 들어가지 않는다.
# - evidence-auditor(stage: details): 판정 기준으로 함께 읽는다.
# - detail-schema-drafter: 같은 이름의 항목을 만들 때 fill_rule과 값 설명이 이 규칙과 어긋나지 않게 쓴다.
# 승인 스키마의 fill_rule과 이 규칙이 다르면 이 규칙을 따른다. 예시 문장은 넣지 않았다(정답 세트와 겹치지 않는지 확인한 예시만 넣는다).

rules:
  - id: repurchase
    items: [purchase_context]
    rule: "purchase_context repurchase: 같은 제품을 예전에 직접 쓰거나 산 적이 있다고 말하면 repurchase로 채운다. 계속 써 왔든, 오래전에 쓰다 다시 샀든 같다. 시향, 샘플, 남이 쓰는 것을 맡아 본 것만 있으면 채우지 않는다."
  - id: comparison_one_value_per_target
    items: [comparison_reference]
    rule: "comparison_reference: 비교 대상 하나에는 값을 하나만 넣고, 가장 구체적인 값을 고른다. 예전 병을 정규 판매처(매장, 백화점, 브랜드 공식 사이트)에서 샀다고 말하면 store_purchase. 그 밖에 리뷰어가 예전에 쓰거나 산 같은 제품이면 same_product_before. 어디서 온 기준인지 없이 \"정품\", \"원래 것\"만 말하면 original_unspecified. 정품 의심 자체는 fake_suspicion_basis 항목이 담으므로 여기에 겹쳐 넣지 않는다. 비교 대상이 서로 다르면(예: 예전 병과 다른 브랜드 향) 대상마다 하나씩 넣는다."
  - id: gift_direction
    items: [purchase_context]
    rule: "purchase_context gift_for_other: 리뷰어가 남에게 주려고 샀다는 방향이 드러나면 받는 사람이 없어도 채운다(\"bought it as a gift\", \"for gifts\"). 받았다는 방향이면 received_as_gift. \"this was a gift\"처럼 주고받는 방향을 알 수 없으면 비운다. 함께 쓰거나 가족이 써 봤다는 말만 있으면 선물이 아니다. \"받는 사람이 인용에 드러나게\"는 받는 사람이 있을 때 인용을 고르는 지침이다."
  - id: dupe_target
    items: [comparison_reference]
    rule: "dupe_target: 리뷰가 듀프, 대체품, \"inspired by\"처럼 원조 관계를 말할 때만 채운다. 닮았다는 말만 있으면 other_product. 판정자는 원문 밖 지식을 쓰지 않는다."
  - id: unclear_same_or_other
    items: [comparison_reference]
    rule: "같은 제품인지 다른 제품인지 원문으로 가를 수 없는 비교(\"otro que tenía\")는 other_product."
  - id: mention_without_comparison
    items: [comparison_reference]
    rule: "다른 향을 샀다거나 좋아한다는 말만 있고 이 제품과 견주지 않으면 comparison_reference를 비운다."
  - id: first_purchase
    items: [purchase_context]
    rule: "first_purchase: 처음 써 본다는 뜻이 분명하면(\"first time\", \"finally give it a try\") 채운다."

# 값 설명 보충(승인 스키마의 같은 값 설명보다 먼저)
value_notes:
  - {item: comparison_reference, value: store_purchase, ko: "매장(정규 매장, 백화점, 브랜드 공식 사이트)에서 산 같은 제품"}
