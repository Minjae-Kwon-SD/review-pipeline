# 모든 카테고리에 남기는 공통 주제 11개. schema-drafter의 출발점이다.
# 정답지(스크럽 리포트)의 주제 틀과 같은 틀로 비교하기 위해 언급이 없어도 빼지 않는다.
# 브랜드 쪽(side B) 6개는 그대로 쓰고, 제품 쪽(side P) 5개는 카테고리에 맞게 id, name_ko, definition을 다시 쓸 수 있다
# (다시 쓰면 그 주제의 common_id에 아래 원래 id를 적는다). 카테고리 전용 주제는 schema-drafter가 리뷰 표본에서 찾는다.
# 감성 판정 순서(2026-10-13 담당자 결정). 모든 주제에 공통이고, 한 리뷰의 한 주제 안에서만 본다.
# 승인 스키마의 sentiment_notes와 어긋나면 이 순서를 따른다(태거, 감사자, 정답 세트 화면이 읽음).
tagging_rule:
  - 1. 구체적인 좋은 점과 나쁜 점이 둘 다 있으면 혼합(mixed). 리뷰어가 한쪽으로 기울어도 혼합. 효과는 좋은데 과정 불만이 붙어도 그 주제 안에서 혼합. 나빴다가 괜찮아졌으면 혼합. "털이 다시 났다"는 일단 빠졌다는 뜻이라 혼합.
  - 2. 나쁜 점만 있으면 부정(negative). 약해도 부정. 피부 반응은 "살짝"이어도 부정. "일부만 됐다", "충분히 잘은 안 된다"는 부정. 효과가 없다는 말과 같이 나온 "심각하진 않았다"는 칭찬이 아님.
  - 3. 좋은 점만 있으면 긍정(positive).
  - 4. 그 주제 얘기는 했지만 평가가 없으면 중립(neutral). 있었던 일만 적은 말("4분 발라 뒀다"), 구체적인 게 없는 미지근한 말("최악은 아니지만 최고도 아니다", "Not bad" 혼자), 앞으로의 계획이나 질문. "4분이면 충분했다"처럼 평가가 들어가면 중립 아님.
topics:
  - id: price_value
    name_ko: 가격 대비 가치
    side: B
    redefine: false
    definition: 가격, 용량 대비 값어치, 할인
    source: Price & Value
  - id: brand_experience
    name_ko: 브랜드 경험
    side: B
    redefine: false
    definition: 브랜드 호감, 재구매, 추천 의향
    source: Brand Experience
  - id: trust
    name_ko: 신뢰
    side: B
    redefine: false
    definition: 리스팅과 실물 차이, 정품 여부 의심
    source: Reputation & Trust
  - id: shipping
    name_ko: 배송
    side: B
    redefine: false
    definition: 배송 속도, 파손, 누락
    source: Shipping & Delivery
  - id: customer_service
    name_ko: 고객 응대
    side: B
    redefine: false
    definition: 반품, 환불, 판매자 응대
    source: Customer Service
  - id: packaging
    name_ko: 포장
    side: B
    redefine: false
    definition: 상자, 선물 포장 상태
    source: Package Design
  - id: overall
    name_ko: 전체 만족도
    side: P
    redefine: true
    definition: 특정 속성 없이 제품이 좋다, 나쁘다
    source: Overall Satisfaction
    # 2026-10-10 공통 규칙(H1 태그 감사 FAIL 23개 중 20개가 이 규칙 충돌). schema-drafter는 이 문장을 overall의 tagging_rule에 그대로 옮기고,
    # exclude에 "이유가 붙은 평가는 overall이 아니다"처럼 이 규칙과 부딪치는 문장을 쓰지 않는다.
    tagging_rule: >-
      overall은 off_category가 아닌 모든 리뷰에 하나씩 단다(리뷰 단위 총평이라 비교, 세부 이슈, 가이드 집계에서는 빠지고 1~3장 분포에만 쓴다).
      총평 문장(이유 없이 좋다, 나쁘다, 추천한다가 아닌 만족 표현)이 있으면 그 문장을 인용하고 그 감성으로 정한다.
      총평 문장이 없으면 감성은 그 리뷰에 단 다른 주제들의 감성으로 정한다(긍정과 부정이 섞이면 mixed, 한쪽뿐이면 그쪽, 모두 neutral이면 neutral).
      이때 인용은 리뷰에서 가장 핵심적인 평가 부분(제목도 됨)을 원문 그대로 쓰고, 그 인용이 다른 주제의 인용과 같거나 겹쳐도 된다.
      이유가 붙은 평가("Works but it hurts")는 이유 주제(효과, 통증 등)에도 따로 단다. overall 대신이 아니라 함께다.
