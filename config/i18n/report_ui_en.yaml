# 리뷰 리포트 HTML(render_html.py)의 화면 문구 영어판. 키는 한국어 원문(스크립트 안 문구 그대로), 값은 영어.
# {이름} 자리는 스크립트가 숫자나 이름을 넣는 곳이라 영어에도 같은 이름으로 둔다. 빠진 키가 있으면 영어판 만들기가 실패한다.
title: "Amazon Review Analysis: Perfume (EDP/EDT)"
chapters:
  1: Distribution Overview
  2: Mentions and Sentiment by Topic
  3: Topic Evaluation
  4: Impact Analysis
  5: Time Trends
  6: Co-occurring Topics
  7: Reliability Signals
  8: Key Insights
  9: Brand (ASIN) Comparison
  10: Brand Deep Dive
  11: Variant (Size) Signals
  12: Review Explorer
  13: Strategy Direction
