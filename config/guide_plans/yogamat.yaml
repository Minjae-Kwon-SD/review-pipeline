  - {id: durability, title: 만듦새와 내구성, topics: [build_durability]}
  - {id: residue, title: 묻어남과 얼룩, topics: [residue_transfer]}
  - {id: odor, title: 냄새, topics: [odor]}
  - {id: body_safety, title: 몸 반응과 성분, topics: [safety]}
  - {id: size_carry, title: "크기와 휴대, 끈", topics: [carry_strap, design]}
  - {id: listing, title: 설명과 실물, topics: [trust]}
