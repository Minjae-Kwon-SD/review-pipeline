# 단계마다 입력, 출력, 뒤 단계, 상한(docs/multi_agent_design_v2.md). scripts/stage_plan.py와 stage_packet.py가 읽는다.
# 입력과 출력은 회차 폴더(runs/<회차>/) 기준 경로나 글롭이다. "config:"로 시작하면 저장소 맨 위 기준.
# code는 그 단계 결과를 바꾸는 지시문, 코드, 설정(저장소 맨 위 기준). 바뀌면 stage_plan.py plan이 그 단계를 다시 할 단계로 고른다.
# expect는 묶음 계획 파일. 계획의 묶음 출력이 하나라도 없으면 다시 할 단계로 고른다(output이 있으면 그 이름 틀로).
# 상한은 담당자가 숫자를 직접 적어 지시할 때만 바꾼다("빨리"라는 말로 올리지 않는다).

# 대량 작업 방식(method): v2 = 작업 파일과 작업자 배정(scripts/stage_packet.py), per_batch = 묶음마다 에이전트 하나.
# v2는 설계 정보 추출(14_detail_extract)에만 쓴다. 2026-10-08 다시 판정 비교에서, 두 실행 가운데 하나라도 확정값과 다른 같은 52칸으로
# 맞춰 세면 실제로 틀린 값이 우리 감사자 기준 A(지금 방식) 24 대 C3(v2) 19, GPT 독립 판정 기준 A 29 대 C3 23이었다(판정 일치 44/70).
# 태깅(05_tagging)과 이슈 라벨(07b_issue_labeling)은 v2로 품질을 시험한 적이 없어 per_batch다. 작업 파일의 종류별 순서와
# 스키마 공통 규칙 전달(GPT 검토 F10), 태그 입력 파일 나누기(F11)를 고치고 품질 시험을 한 뒤에만 v2로 바꾼다.
# 근거와 한계: docs/compare_v2_result.md, docs/decisions_log.md.

limits:
  bulk_concurrency: 50         # 대량 작업자(sonnet) 동시 실행(이슈 라벨, 설계 정보 추출). 2026-10-12 담당자 결정 4에서 8로, 2026-10-16 16으로(추천 숫자대로), 2026-10-20 50으로(남은 묶음을 한 번에)
  tagging_concurrency: 50      # 태깅(05_tagging) review-tagger 동시 실행. 2026-10-09 담당자 결정(추천안) 8, 2026-10-12 12로, 2026-10-16 20으로(추천 숫자대로), 2026-10-20 50으로(남은 묶음을 한 번에)
  worker_max_batches: 4        # 작업자 하나가 맡는 묶음
  worker_max_reviews: 200      # 작업자 하나가 맡는 리뷰
  retry_per_batch: 2           # 묶음마다 재시도
  retry_per_stage: 4           # 단계 전체 재시도 호출
  top_writers: 15              # 상위 모델 작성자 동시 실행(예: 주제별 issue-labeler 15개, 장 묶음별 report-writer). 2026-10-09 1에서 4로, 2026-10-16 15로(추천 숫자대로)
  top_auditors: 3              # 상위 모델 감사자. 문서 하나에는 감사자 하나(같은 문서를 나눠 감사하지 않음), 리포트 감사와 가이드 감사는 동시에. 2026-10-12 1에서 2로, 2026-10-20 담당자 결정 3으로(라벨 검사 반쪽 둘이 추출 감사와 겹쳐도 같이 돌게)
  review_lenses: 4             # 검토형(같은 큰 자료를 여럿이 봄) 읽기 전용 렌즈. 매번 담당자 허락

stages:
  - {id: 01_inputs, kind: script, inputs: [01_asins.csv, 02_reviews.csv, 02_star_distribution.csv],
     outputs: [00_input_check.json, 03_schema_sample.csv, 03_schema_input.csv], after: [02_schema_draft]}
  - {id: 02_schema_draft, kind: agents, inputs: [03_schema_sample.csv, "config:config/topics_common.yaml"],
     code: [.claude/agents/schema-drafter.md], outputs: [03_schema_draft.yaml], after: [03_schema_approval, 13_detail_schema_draft]}
  - {id: 03_schema_approval, kind: human, inputs: [03_schema_draft.yaml], outputs: [03_schema_approved.yaml], after: [05_tagging]}
  - {id: 05_tagging, kind: agents, bulk: true, method: per_batch, inputs: [03_schema_approved.yaml, "config:config/topics_common.yaml", 04_batches.json, "04_tag_input/*.csv"],
     code: [.claude/agents/review-tagger.md], expect: {batches: 04_batches.json, output: "04_tags_{model}_{batch_id}.jsonl"},
     outputs: ["04_tags_sonnet_*.jsonl", "04_tags_top_*.jsonl"], after: [06_tag_check]}
  - {id: 06_tag_check, kind: agents, inputs: ["04_tags_sonnet_*.jsonl", 04_audit_sample.jsonl, "config:config/topics_common.yaml"], code: [.claude/agents/evidence-auditor.md],
     edits: ["04_tags_sonnet_*.jsonl"],   # 2026-10-21: 실패 묶음 다시 태깅이 바꾸는 입력(완료를 막지 않음)
     outputs: [04_tags.jsonl, 04_quote_check_sonnet.json, 04_tag_audit.yaml, 04_tag_audit_summary.json], after: [07a_issue_draft, 22_robustness, 08a_report_early, 16a_guide_metrics_early]}
  - {id: 07a_issue_draft, kind: agents, inputs: [04_tags.jsonl], code: [.claude/agents/issue-labeler.md], outputs: [07a_issues_draft.yaml],
     after: [07a_issue_approval]}
  - {id: 07a_issue_approval, kind: human, inputs: [07a_issues_draft.yaml], outputs: [07a_issues_approved.yaml], after: [07b_issue_labeling]}
  - {id: 07b_issue_labeling, kind: agents, bulk: true, method: per_batch, inputs: [07a_issues_approved.yaml, 04_tags.jsonl, 07b_label_batches.json],
     code: [.claude/agents/issue-tagger.md], expect: {batches: 07b_label_batches.json},
     outputs: ["07b_labels_*.jsonl"], after: [07c_issue_check]}
  - {id: 07c_issue_check, kind: agents, inputs: ["07b_labels_*.jsonl", 07c_safety_input.jsonl], code: [.claude/agents/evidence-auditor.md],
     outputs: [07b_issue_labels.jsonl, 07b_issue_counts.json, 07c_safety_verdicts.yaml, 07c_safety_summary.json], after: [22_robustness]}
  - {id: 22_robustness, kind: script, inputs: [04_tags.jsonl, 07b_issue_labels.jsonl, 02_reviews.csv, 02_star_distribution.csv], code: [config/pipeline.yaml],
     outputs: [05_robustness.json], after: [07_weight]}
  - {id: 07_weight, kind: script, inputs: [04_tags.jsonl, 07b_issue_counts.json, 07c_safety_summary.json, 05_robustness.json, 01_prices.json],
     code: [config/pipeline.yaml],
     outputs: [05_metrics.json, 05_tables.md, 05_quote_pool.json], after: [08_report, 16_guide_metrics]}
  # 2026-10-16 리포트 장 묶음: 세부 이슈 라벨이 필요 없는 1~7장과 9장은 06_tag_check 뒤 weight.py --early 값으로 바로 쓰고(08a),
  # 8, 10, 11, 12장과 부록은 07_weight 뒤에 쓴다(08, 11장 변형 신호의 방향 표는 라벨로 셈). 08에서 미리 쓴 장에 라벨, 안전, 견고성 근거를 더한다(보강). report_parts.py assemble이 묶음을 틀 순서로 이어 붙이고 {{표: 이름}} 자리에 05_tables.md 블록을 끼워 06_report.md를 만든다.
  - {id: 08a_report_early, kind: agents, inputs: [05_metrics_early.json, 05_tables_early.md, 05_quote_pool_early.json],
     code: [.claude/agents/report-writer.md, config/report_template_ko.md],
     outputs: [06_report_part_1-7.md, 06_report_part_9.md], after: [08_report]}
  - {id: 08_report, kind: agents, inputs: [05_metrics.json, 05_tables.md, 05_quote_pool.json, 05_tables_early.md, 05_metrics_early.json],
     code: [.claude/agents/report-writer.md, config/report_template_ko.md, scripts/report_parts.py],
     outputs: [06_report.md, 06_report_part_8.md, 06_report_part_10.md, 06_report_part_11.md, 06_report_part_12.md, 06_report_part_appendix.md,
               06_report_parts_check.json],
     after: [09_report_check]}
  - {id: 09_report_check, kind: agents, inputs: [06_report.md, 05_metrics.json], code: [.claude/agents/evidence-auditor.md],
     outputs: [07_quote_check.json, 07_audit.yaml], edits: [06_report.md], after: [11_html]}
  - {id: 11_html, kind: script, inputs: [06_report.md, 05_metrics.json, 07b_issue_counts.json],
     outputs: [06_report.html, 06_report_html_numbers.json, 06_report_html_check.json], after: []}
  - {id: 12_market, kind: script, inputs: ["market/raw/*.json"], outputs: [market/market.json, market/market_summary.md], after: [16a_guide_metrics_early, 16_guide_metrics, 15_research]}
  # 2026-10-10 앞당기기: 13_detail_schema_draft는 태깅과 같은 때 돌린다(2026-10-21부터 02 스키마 초안이 끝나면 바로, 승인을 기다리지 않음). 15_research는 2026-10-20부터 12_market 뒤 바로(스키마를 기다리지 않음)(review-run.md "앞당겨 돌리는 단계").
  - {id: 13_detail_schema_draft, kind: agents, inputs: [13_detail_sample.csv, 03_schema_draft.yaml], code: [.claude/agents/detail-schema-drafter.md, config/detail_rules.yaml],
     outputs: [13_detail_schema_draft.yaml], after: [13a_detail_schema_approval]}
  - {id: 13a_detail_schema_approval, kind: human, inputs: [13_detail_schema_draft.yaml], outputs: [13_detail_schema_approved.yaml], after: [14_detail_extract]}
  - {id: 14_detail_extract, kind: agents, bulk: true, method: v2, inputs: [13_detail_schema_approved.yaml, 14_detail_batches.json, "14_detail_input/*.jsonl"],
     code: [.claude/agents/detail-extractor.md, scripts/stage_packet.py, config/detail_rules.yaml], expect: {batches: 14_detail_batches.json},
     outputs: ["14_details_B*.jsonl"], after: [14b_detail_check]}
  - {id: 14b_detail_check, kind: agents, inputs: ["14_details_B*.jsonl", 14b_detail_audit_sample.jsonl, 14_known_exceptions.yaml],
     code: [.claude/agents/evidence-auditor.md, config/detail_rules.yaml],
     outputs: [14_details.jsonl, 14_detail_counts.json, 14b_detail_audit.yaml, 14b_detail_audit_summary.json], after: [16a_guide_metrics_early, 16_guide_metrics]}
  - {id: 15_research, kind: agents, inputs: [market/market.json, "config:config/topics_common.yaml"], code: [.claude/agents/benchmark-researcher.md, scripts/research.py],
     outputs: [15_research.yaml, 15_research_check.json, 15_research_followup_input.json, 15_research_followup.yaml, 15_research_first.yaml], after: [17a_guide_early, 17_guide_write]}
  - {id: 23_specs, kind: agents, inputs: [23_spec_input.json], code: [.claude/agents/product-spec-collector.md],
     outputs: [23_specs.yaml, 23_specs_check.json, 23_specs_verified.json], after: [16a_guide_metrics_early, 16_guide_metrics]}
  # 2026-10-17 가이드 장 묶음(안 B): 01, 02, A장은 세부 이슈 라벨 전에 guide_metrics.py --early 값으로 미리 쓰고 미리 감사한다(16a, 17a).
  # 라벨 뒤 17에서 03과 04를 같은 때(원인 번호는 guide_metrics.py의 p.causes), 그다음 머리 숫자와 05, 01-02-A 보강, guide_parts.py assemble.
  - {id: 16a_guide_metrics_early, kind: script, inputs: [05_metrics_early.json, 14_details.jsonl, market/market.json, 23_specs_verified.json],
     code: [scripts/guide_metrics.py], outputs: [16_guide_metrics_early.json, 16_guide_writer_input_early.json], after: [17a_guide_early]}
  - {id: 17a_guide_early, kind: agents, inputs: [16_guide_writer_input_early.json, 15_research_check.json],
     code: [.claude/agents/guide-writer.md, .claude/agents/evidence-auditor.md], outputs: [17_guide_part_01-02-A_early.md, 18_guide_audit_early.yaml],
     after: [17_guide_write]}
  - {id: 16_guide_metrics, kind: script, inputs: [05_metrics.json, 14_details.jsonl, market/market.json, 23_specs_verified.json, 05_robustness.json],
     code: [scripts/guide_metrics.py], outputs: [16_guide_metrics.json, 16_guide_writer_input.json], after: [17_guide_write]}
  - {id: 17_guide_write, kind: agents, inputs: [16_guide_writer_input.json, 15_research_check.json],
     code: [.claude/agents/guide-writer.md, scripts/guide_parts.py],
     outputs: [17_guide_part_01-02-A.md, 17_guide_part_03.md, 17_guide_part_04.md, 17_guide_part_head-05.md, 17_guide.md, 17_guide_parts_check.json], after: [18_guide_check]}
  - {id: 18_guide_check, kind: agents, inputs: [17_guide.md, 16_guide_metrics.json, 16_guide_writer_input.json], code: [.claude/agents/evidence-auditor.md],
     outputs: [18_guide_quote_check.json, 18_guide_audit.yaml], edits: [17_guide.md], after: [19_guide_html]}
  - {id: 19_guide_html, kind: script, inputs: [17_guide.md, 16_guide_metrics.json, 15_research_check.json],
     outputs: [07_guide.html, 07_guide_html_numbers.json, 07_guide_html_check.json], after: []}
